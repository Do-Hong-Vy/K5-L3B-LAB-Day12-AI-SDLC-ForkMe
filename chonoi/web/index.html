<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Đại Chiến Đa Vũ Trụ | Nhóm ForkMe</title>
<style>
  :root {
    --bg-dark: #070d17;
    --panel-bg: rgba(11, 20, 34, 0.88);
    --panel-border: rgba(246, 196, 83, 0.35);
    --gold: #f6c453;
    --amber: #f59e0b;
    --red: #ef4444;
    --green: #22c55e;
    --cyan: #38bdf8;
    --purple: #a855f7;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-dark);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  /* Lớp overlay DOM gọn nhẹ cho Menu chính / Pause / Shop / Cài đặt (không che canvas khi đang chơi) */
  .overlay-root {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(10, 18, 34, 0.72), rgba(4, 8, 16, 0.90));
    backdrop-filter: blur(7px);
    z-index: 20;
    padding: 20px;
  }
  .overlay-root.active { display: flex; }
  .modal-card {
    width: min(640px, 95vw);
    max-height: 92vh;
    overflow-y: auto;
    background: linear-gradient(160deg, rgba(16, 28, 48, 0.97), rgba(9, 15, 28, 0.98));
    border: 2px solid rgba(246, 196, 83, 0.55);
    border-radius: 18px;
    padding: 26px 28px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 36px rgba(246, 196, 83, 0.14);
    text-align: center;
  }
  .modal-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.6px;
    background: rgba(246, 196, 83, 0.16);
    border: 1px solid rgba(246, 196, 83, 0.45);
    color: #fde047;
    margin-bottom: 10px;
  }
  .modal-title {
    margin: 4px 0 8px;
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #fde047, #fb923c, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .modal-sub {
    margin: 0 0 18px;
    font-size: 15px;
    color: #cbd5e1;
    line-height: 1.5;
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
  }
  .btn {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 13px 26px;
    font-size: 17px;
    font-weight: 700;
    transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: #0b131e;
    box-shadow: 0 6px 22px rgba(245, 158, 11, 0.38);
  }
  .btn-cyan {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #ffffff;
    box-shadow: 0 6px 22px rgba(56, 189, 248, 0.32);
  }
  .btn-green {
    background: linear-gradient(135deg, #22c55e, #15803d);

  .btn-ghost {

  }

  .settings-grid {

    text-align: left;

  .setting-row {
    display: flex;
    align-items: center;

  .setting-row input[type="range"] {

    cursor: pointer;

  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;

  }
  .shop-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(246, 196, 83, 0.32);
    border-radius: 12px;

    display: flex;

  .shop-item h3 { margin: 0; font-size: 18px; color: #fde047; }
  .shop-item p { margin: 0; font-size: 14px; color: #cbd5e1; }
  .stat-grid {

  .stat-box {
    background: rgba(255, 255, 255, 0.05);

  .quick-bar {

    display: flex;

  .qbtn {

    background: rgba(11, 20, 34, 0.88);
    border: 1px solid rgba(246, 196, 83, 0.42);

<body>
<canvas id="c"></canvas>

<!-- Thanh điều khiển nhanh trên góc phải -->
<div class="quick-bar" id="quickBar">
  <button class="qbtn creative-on" id="btnCreativeQuick" title="Phím C: Bật/Tắt chế độ Sáng tạo Aquaman × Goku SSJ3">⚡ Đa Vũ Trụ: BẬT [C]</button>
  <button class="qbtn" id="btnAudioQuick" title="Phím M: Bật/Tắt Âm thanh">🔊 Nhạc: BẬT [M]</button>

<!-- Overlay: Menu Chính / Pause / Intro / Result / Shop / Summary -->
<div class="overlay-root active" id="overlayRoot">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
"use strict";
/*
 * ============================================================================
 * QUÁN ĂN CHỢ NỔI — CLIENT UI/HUD v2.0 + SÁNG TẠO ĐA VŨ TRỤ (Nhóm ForkMe)
 * Tác giả: Đinh Hoàng Phong (Phog2811)
 * ----------------------------------------------------------------------------
 * - Tuân thủ 100% Test Contract v1.0 & v1.1 (PRD-0 & Ticket-02):
 *   CHỈ ĐỌC snapshot từ GET /state và GỬI lệnh qua POST /input, POST /restart.
 * - Toàn bộ 2.5D VFX, Web Audio BGM/SFX và Chế độ Sáng tạo (Aquaman dưới sông
 *   & Goku SSJ3 trên nhà bè) chạy thuần phía client -> TẮT 100% ở headless!
 * - Phím điều khiển:
 *   WASD / Mũi tên : Bơi (gather) / Đi (quan)
 *   E              : Tương tác (Cập bến, Hái rau, Nấu bếp, Bưng món, Phục vụ)
 *   Space          : Bắt cá (gather) / Chiêu Đấu Chưởng VFX (quan, sáng tạo)
 *   Q              : Lao xua (nếu bật mở rộng) / Tuyệt chiêu Sáng tạo VFX
 *   F              : Chụp ảnh Cá Hô (nếu bật mở rộng)
 *   Esc / P        : Tạm dừng (Pause Menu)
 *   C              : Bật/Tắt Chế độ Sáng tạo (Aquaman × Goku SSJ3)
 *   M              : Bật/Tắt Âm thanh
 *   H              : Ẩn/Hiện Sổ tay Thực đơn
 *   R              : Chơi lại
 * ============================================================================
 */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const overlayRoot = document.getElementById("overlayRoot");
const modalCard = document.getElementById("modalCard");
const btnCreativeQuick = document.getElementById("btnCreativeQuick");
const btnAudioQuick = document.getElementById("btnAudioQuick");
const btnRecipeQuick = document.getElementById("btnRecipeQuick");
const btnPauseQuick = document.getElementById("btnPauseQuick");

// ---------- Cấu hình lưu localStorage (Settings & Âm thanh) ----------
function loadPrefs() {
  try {
    const raw = localStorage.getItem("chonoi_forkme_prefs_v2");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { master: 0.7, music: 0.45, sfx: 0.85, muted: false, creative: true };
}
function savePrefs() {
  try { localStorage.setItem("chonoi_forkme_prefs_v2", JSON.stringify(prefs)); } catch (e) {}
}
const prefs = loadPrefs();

// ---------- Trạng thái Client ----------
let snap = null;
let offline = false;
let showHelp = true;
let uiScreen = "menu"; // "menu" | "playing" | "intro" | "evening_intro" | "day_result" | "pause" | "shop" | "summary" | "quit"
let introTimer = 0;
let introPayload = null;
let lastPhaseKey = "";
let lastProcessedEventKey = "";
let localPaused = false;
let sessionStats = {
  servedCount: 0,
  leftCount: 0,
  tipsTotal: 0,
  dishCounts: {},
  startRep: 3.0,
  dayEarned: 0
};

// ---------- Sprite CC0 — Kenney Fish Pack 2.0 (www.kenney.nl, CREDITS.md) ----------
// Chỉ là hình ảnh phía client; mô phỏng/headless không đổi. Chưa tải xong thì vẽ hình khối dự phòng.
const SPRITE_FILES = {
  ca_linh: "fish_blue", ca_loc: "fish_grey", ca_keo: "fish_green",
  weed_a: "seaweed_green_b", weed_b: "seaweed_green_d", weed_c: "seaweed_grass_a", weed_d: "seaweed_orange_a",
  rock_a: "rock_a", rock_b: "rock_b", bubble_a: "bubble_a", bubble_b: "bubble_b",
};
const SPRITES = {};
Object.entries(SPRITE_FILES).forEach(([key, file]) => {
  const img = new Image();
  img.onload = () => { SPRITES[key] = img; };
  img.src = `/assets/kenney/${file}.png`;
});

// ---------- Từ điển chuẩn Contract v1.0 & v1.1 (6 nguyên liệu, 6 món) ----------
const KIND_COLOR = {
  ca_loc: "#84a955",
  ca_linh: "#bae6fd",
  ca_keo: "#f59e0b",
  bong_dien_dien: "#facc15",
  bong_sung: "#f472b6",
  keo_neo: "#4ade80"
};
const KIND_NAME = {
  ca_loc: "Cá lóc",
  ca_linh: "Cá linh",
  ca_keo: "Cá kèo",
  bong_dien_dien: "Bông điên điển",
  bong_sung: "Bông súng",
  keo_neo: "Kèo nèo"
};
const KIND_SHORT = {
  ca_loc: "Lóc",
  ca_linh: "Linh",
  ca_keo: "Kèo",
  bong_dien_dien: "Đ.Điển",
  bong_sung: "B.Súng",
  keo_neo: "K.Nèo"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây"
};
const DEFAULT_MENU = {
  ca_loc_nuong_trui: { recipe: { ca_loc: 1 }, cook_s: 6, price: 60 },
  goi_bong_sung: { recipe: { bong_sung: 2 }, cook_s: 4, price: 40 },
  lau_ca_linh_dien_dien: { recipe: { ca_linh: 3, bong_dien_dien: 1 }, cook_s: 10, price: 120 },
  canh_chua_ca_loc: { recipe: { ca_loc: 1, bong_dien_dien: 1 }, cook_s: 8, price: 90 },
  ca_keo_nuong: { recipe: { ca_keo: 2 }, cook_s: 6, price: 70 },
  lau_mam: { recipe: { ca_linh: 2, ca_keo: 1, keo_neo: 1, bong_dien_dien: 1 }, cook_s: 12, price: 200 }
};
const DEFAULT_SHOP = {
  oxygen: [
    { level: 1, price: 200, oxygen_max_s: 45 },
    { level: 2, price: 400, oxygen_max_s: 60 }
  ],
  hp: [
    { level: 1, price: 250, hp_max: 4 },
    { level: 2, price: 500, hp_max: 5 }
  ]
};
const REASON_TEXT = {
  docked: "Đã cập bến bàn giao kho an toàn",
  time: "Hết thời gian ca làm việc",
  fainted: "Ngất xỉu dưới sông (Kho bàn giao rỗng!)",
  days_complete: "Hoàn thành xuất sắc hành trình Chợ Nổi!",
  tick_limit: "Chạm giới hạn bước mô phỏng",
  error: "Lỗi thực thi mô phỏng"
};

const kc = (k) => KIND_COLOR[k] || "#cbd5e1";
const kName = (k) => KIND_NAME[k] || k;
const dId = (d) => (!d ? "" : (typeof d === "string" ? d : (d.dish_id || "")));
const dName = (d) => {
  const id = dId(d);
  return DISH_NAME[id] || id || "Món ăn";
};
function activePhase() {
  if (!snap) return "gather";
  return snap.phase || snap.mode || "gather";
}
function getPhaseMeta(ph) {
  const m = (snap && snap.meta) || {};
  if (m[ph] && typeof m[ph] === "object") return m[ph];
  return m;
}
function getFullMenu() {
  const m = (snap && snap.meta) || {};
  if (m.menu && typeof m.menu === "object") return m.menu;
  return DEFAULT_MENU;
}
function getShopConfig() {
  const m = (snap && snap.meta) || {};
  if (m.shop && m.shop.upgrades) return m.shop.upgrades;
  return DEFAULT_SHOP;
}

// ============================================================================
// BỘ TỔNG HỢP ÂM THANH & NHẠC NỀN (WEB AUDIO API — 100% PROCEDURAL, 0 FILE NGOÀI)
// ============================================================================
const AudioEngine = (() => {
  let actx = null;
  let bgmTimer = null;
  let stepIdx = 0;

  function ensure() {
    if (!actx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) actx = new Ctx();
    }
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
    return actx;
  }

  function gainLevel(type) {
    if (prefs.muted) return 0;
    return Math.max(0, Math.min(1, prefs.master * (type === "music" ? prefs.music : prefs.sfx)));
  }

  function tone(freq, dur, wave = "sine", vol = 0.25, slideTo = null, type = "sfx") {
    const c = ensure();
    const gVal = gainLevel(type) * vol;
    if (!c || gVal <= 0.001) return;
    const now = c.currentTime;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(gVal, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function noise(dur, vol = 0.2, highpass = 600) {
    const c = ensure();
    const gVal = gainLevel("sfx") * vol;
    if (!c || gVal <= 0.001) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const flt = c.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = highpass;
    const gain = c.createGain();
    gain.gain.value = gVal;
    src.connect(flt);
    flt.connect(gain);
    gain.connect(c.destination);
    src.start();
  }

  // Nhạc nền đa phong cách: Ngũ cung Miền Tây (Thường) vs Anime Boss Battle (Đa Vũ Trụ)
  const SCALE_MEKONG_DAY = [293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 440.00, 392.00, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 293.66];
  const SCALE_MEKONG_NIGHT = [220.00, 261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 261.63, 220.00, 293.66, 329.63, 440.00, 392.00, 329.63, 293.66, 220.00];
  const SCALE_ANIME_AQUA = [146.83, 174.61, 220.00, 261.63, 293.66, 261.63, 220.00, 196.00, 146.83, 220.00, 293.66, 329.63, 349.23, 329.63, 293.66, 220.00];
  const SCALE_ANIME_SSJ3 = [164.81, 164.81, 196.00, 220.00, 246.94, 220.00, 196.00, 146.83, 164.81, 246.94, 293.66, 329.63, 392.00, 329.63, 293.66, 246.94];

  function startBgm() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (!actx || actx.state !== "running" || prefs.muted || gainLevel("music") <= 0.002) return;
      if (uiScreen === "pause" || uiScreen === "quit") return;
      const ph = activePhase();
      const creative = prefs.creative;
      let seq, bass, wave;
      if (creative) {
        seq = ph === "quan" ? SCALE_ANIME_SSJ3 : SCALE_ANIME_AQUA;
        bass = ph === "quan" ? 82.41 : 73.42;
        wave = "sawtooth";
      } else {
        seq = ph === "quan" ? SCALE_MEKONG_NIGHT : SCALE_MEKONG_DAY;
        bass = ph === "quan" ? 110.0 : 146.83;
        wave = "triangle";
      }
      const n = seq[stepIdx % seq.length];
      tone(n, creative ? 0.14 : 0.24, wave, creative ? 0.11 : 0.14, null, "music");
      if (stepIdx % 2 === 0) {
        tone(bass * (stepIdx % 8 === 6 ? 1.25 : 1), 0.18, "triangle", creative ? 0.16 : 0.10, null, "music");
      }
      if (creative && stepIdx % 4 === 2) {
        tone(n * 2, 0.08, "square", 0.05, null, "music");
      }
      stepIdx++;
    }, 185);
  }

  function playSfx(name) {
    ensure();
    switch (name) {
      case "dive": tone(360, 0.18, "sine", 0.28, 120); noise(0.14, 0.18, 500); break;
      case "surface": tone(180, 0.20, "sine", 0.24, 520); break;
      case "gather": tone(523, 0.09, "triangle", 0.28, 784); setTimeout(() => tone(880, 0.11, "triangle", 0.22), 60); break;
      case "fish_caught":
        tone(320, 0.10, "sawtooth", 0.26, 860);
        setTimeout(() => tone(980, 0.14, "triangle", 0.26, 1320), 65);
        noise(0.12, 0.2, 1200);
        break;
      case "hold_full":
      case "buy_failed":
        tone(170, 0.14, "sawtooth", 0.26, 120);
        setTimeout(() => tone(130, 0.16, "sawtooth", 0.24, 95), 110);
        break;
      case "oxygen_empty":
      case "choke":
      case "monster_hit":
        tone(150, 0.24, "sawtooth", 0.35, 65);
        noise(0.18, 0.28, 350);
        break;
      case "faint":
        tone(300, 0.35, "sawtooth", 0.32, 70);
        setTimeout(() => tone(180, 0.45, "sine", 0.28, 55), 180);
        break;
      case "cook_started": noise(0.24, 0.22, 1800); tone(260, 0.12, "triangle", 0.2, 340); break;
      case "dish_ready": tone(880, 0.14, "sine", 0.3); setTimeout(() => tone(1318, 0.22, "sine", 0.3), 100); break;
      case "dish_picked": tone(440, 0.09, "triangle", 0.22, 660); break;
      case "served":
        // Tiếng chưởng Kamehame-Lẩu cực đã!

// ============================================================================
// HỆ THỐNG VFX 2.5D (PARTICLES, BEAMS, FLOATING TEXTS, SCREEN SHAKE, BOSS)
// ============================================================================
const vfx = {
  particles: [],
  texts: [],
  beams: [],
  ripples: [],
  shake: 0,
  bubbles: Array.from({ length: 34 }, () => ({
    x: Math.random() * 100, d: 1 + Math.random() * 28,
    r: 1.5 + Math.random() * 3.0, spd: 0.015 + Math.random() * 0.032, ph: Math.random() * 6.28
  })),
  // Trạng thái hình ảnh thuần Client cho Boss A-Qua-Mèn & Gô-Ku SSJ3
  aquaman: { x: 56, d: 15, dir: 1, hp: 100, maxHp: 100, hurtFlash: 0, speech: "", speechTimer: 0, tridentCooldown: 0 },
  goku: { speech: "", speechTimer: 0, powerBurst: 0, clashTimer: 0 }
};

function spawnParticles(x, y, color, count = 14, speed = 3.2, life = 0.65, size = 3.5) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.35 + Math.random() * 0.9) * speed;
    vfx.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.5,
      color, life, maxLife: life, size: size * (0.6 + Math.random() * 0.8)
    });
  }
}
function spawnText(x, y, msg, color = "#fde047", size = 18) {
  vfx.texts.push({ x, y, vy: -1.15, msg, color, size, life: 1.35, maxLife: 1.35 });
}
function spawnRipple(x, y, color = "#38bdf8", maxR = 64) {
  vfx.ripples.push({ x, y, r: 8, maxR, color, life: 0.55, maxLife: 0.55 });
}
function spawnBeam(x1, y1, x2, y2, color1 = "#38bdf8", color2 = "#fde047", width = 18) {
  vfx.beams.push({ x1, y1, x2, y2, color1, color2, width, life: 0.48, maxLife: 0.48 });
}
function addShake(amount) {
  vfx.shake = Math.min(18, Math.max(vfx.shake, amount));
}

function updateAndDrawVfx(dt) {
  // Cập nhật & vẽ sóng xung kích
  for (let i = vfx.ripples.length - 1; i >= 0; i--) {
    const r = vfx.ripples[i];
    r.life -= dt;
    if (r.life <= 0) { vfx.ripples.splice(i, 1); continue; }
    const prog = 1 - r.life / r.maxLife;
    ctx.save();
    ctx.globalAlpha = (1 - prog) * 0.85;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 * (1 - prog) + 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r + (r.maxR - r.r) * prog, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  // Cập nhật & vẽ chưởng năng lượng (Kamehame-Lẩu / Đinh Ba / Sóng Bà Ba)
  for (let i = vfx.beams.length - 1; i >= 0; i--) {
    const b = vfx.beams[i];
    b.life -= dt;
    if (b.life <= 0) { vfx.beams.splice(i, 1); continue; }
    const a = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.lineCap = "round";
    ctx.shadowColor = b.color1;
    ctx.shadowBlur = 22;
    ctx.strokeStyle = b.color1;
    ctx.lineWidth = b.width * a;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = b.color2;
    ctx.lineWidth = b.width * 0.45 * a;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    // Cầu nổ đầu chưởng
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(b.x2, b.y2, b.width * 0.85 * a, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // Cập nhật & vẽ hạt
  for (let i = vfx.particles.length - 1; i >= 0; i--) {
    const pt = vfx.particles[i];
    pt.life -= dt;
    if (pt.life <= 0) { vfx.particles.splice(i, 1); continue; }
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.04;
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // Cập nhật & vẽ chữ bay nổi
  for (let i = vfx.texts.length - 1; i >= 0; i--) {
    const t = vfx.texts[i];
    t.life -= dt;
    if (t.life <= 0) { vfx.texts.splice(i, 1); continue; }
    t.y += t.vy;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (t.life / t.maxLife) * 1.4);
    text(t.msg, t.x, t.y, { size: t.size, align: "center", bold: true, color: t.color, shadow: true });
    ctx.restore();
  }
  if (vfx.shake > 0) vfx.shake = Math.max(0, vfx.shake - dt * 28);
  if (vfx.aquaman.hurtFlash > 0) vfx.aquaman.hurtFlash = Math.max(0, vfx.aquaman.hurtFlash - dt * 3);
  if (vfx.aquaman.speechTimer > 0) vfx.aquaman.speechTimer = Math.max(0, vfx.aquaman.speechTimer - dt);
  if (vfx.goku.speechTimer > 0) vfx.goku.speechTimer = Math.max(0, vfx.goku.speechTimer - dt);
  if (vfx.goku.powerBurst > 0) vfx.goku.powerBurst = Math.max(0, vfx.goku.powerBurst - dt);
}

// ---------- Chuyển đổi tọa độ thế giới <-> màn hình dùng chung cho VFX ----------
let lastTransform = { sx: (x) => x, sy: (y) => y, s: 10 };

// ---------- Vào: Bàn phím & Gửi Input ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput(extra = null) {
  const ph = activePhase();
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (ph === "quan") dy = -dy; // quan: lên (bắc) = z dương
  const payload = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
  if (extra) Object.assign(payload, extra);
  return payload;
}
function sendRawInput(obj) {
  const s = JSON.stringify(obj);
  queue.push(s);
  flush();
}
function pushInput() {
  if (uiScreen !== "playing") return;
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}
function triggerRestart(goToIntro = true) {
  fetch("/restart", { method: "POST" }).catch(() => {});
  lastSent = "";
  down.clear();
  localPaused = false;
  lastProcessedEventKey = "";
  sessionStats = { servedCount: 0, leftCount: 0, tipsTotal: 0, dishCounts: {}, startRep: 3.0, dayEarned: 0 };
  vfx.aquaman.hp = 100;
  vfx.aquaman.speech = "";
  vfx.goku.speech = "";
  if (goToIntro) {
    uiScreen = activePhase() === "quan" ? "evening_intro" : "intro";
    introTimer = 4.0;
    renderModal();
  } else {
    uiScreen = "playing";
    renderModal();
  }
}
function sendEdgeButton(btnName) {
  sendRawInput(currentInput({ [btnName]: true }));
  setTimeout(() => sendRawInput(currentInput({ [btnName]: false })), 40);
}
function sendShopBuy(itemId) {
  AudioEngine.ensure();
  sendRawInput(currentInput({ buy: itemId }));
}
function sendShopDone() {
  AudioEngine.playSfx("gather");
  sendEdgeButton("shop_done");
}
function togglePause() {
  if (uiScreen === "menu" || uiScreen === "summary" || uiScreen === "quit") return;
  AudioEngine.ensure();
  localPaused = !localPaused;
  sendEdgeButton("pause");
  if (localPaused) {
    down.clear();
    sendRawInput({ move: [0, 0], interact: false, catch: false, pause: true });
    setTimeout(() => sendRawInput({ move: [0, 0], interact: false, catch: false, pause: false }), 40);
    uiScreen = "pause";
  } else {
    uiScreen = activePhase() === "shop" ? "shop" : "playing";
  }
  renderModal();
}
function toggleCreative() {
  prefs.creative = !prefs.creative;
  savePrefs();
  updateQuickButtons();
  if (snap && uiScreen === "playing") {
    const px = snap.player ? lastTransform.sx(snap.player.pos[0]) : innerWidth / 2;

    spawnRipple(px, py, prefs.creative ? "#fde047" : "#4ade80", 90);

function toggleAudio() {

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  AudioEngine.ensure();
  AudioEngine.startBgm();

  if (k === "c" && !e.repeat) { toggleCreative(); return; }
  if (k === "m" && !e.repeat) { toggleAudio(); return; }
  if (k === "h" && !e.repeat) { showHelp = !showHelp; updateQuickButtons(); return; }

  // Thoát màn Intro / EveningIntro / DayResult bằng phím bất kỳ
  if ((uiScreen === "intro" || uiScreen === "evening_intro" || uiScreen === "day_result") && !e.repeat) {
    e.preventDefault();
    uiScreen = activePhase() === "shop" ? "shop" : "playing";
    renderModal();
    return;
  }
  if (uiScreen === "menu" && (k === "enter" || k === " ") && !e.repeat) {
    e.preventDefault();
    triggerRestart(true);
    return;
  }
  if ((k === "escape" || k === "p") && !e.repeat) {
    e.preventDefault();
    togglePause();
    return;
  }
  if (k === "r" && !e.repeat && uiScreen !== "menu") {
    triggerRestart(false);
    return;
  }
  if (uiScreen === "shop" && !e.repeat) {
    if (k === "1") sendShopBuy("oxygen");
    else if (k === "2") sendShopBuy("hp");
    else if (k === "enter" || k === "e") sendShopDone();
    return;
  }
  if (uiScreen !== "playing") return;

  if (e.repeat) {
    if (k === " " || k.startsWith("arrow")) e.preventDefault();
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") {
    down.add("catch");
    e.preventDefault();
    if (activePhase() === "quan") triggerCreativeActionVfx();
  }
  else if (k === "q") {
    sendEdgeButton("attack");
    triggerCreativeActionVfx();
  }
  else if (k === "f") {
    sendEdgeButton("photo");
  }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
cv.addEventListener("click", () => {
  AudioEngine.ensure();
  AudioEngine.startBgm();
  if (uiScreen === "playing" && prefs.creative) triggerCreativeActionVfx();
});

// XỬ LÝ SỰ KIỆN TỪ SNAPSHOT (ÂM THANH + VFX + THỐNG KÊ + CHUYỂN PHA)
// ============================================================================
function processEventsAndPhases() {
  if (!snap) return;
  const ph = activePhase();
  const dayNum = snap.day || 1;
  const phaseKey = `${dayNum}:${ph}`;

  // Đồng bộ pause từ server nếu backend v1.1 đã bật
  if (snap.state === "paused" && uiScreen === "playing") {
    localPaused = true;
    uiScreen = "pause";
    renderModal();
  } else if (snap.state === "playing" && localPaused && uiScreen === "pause" && snap.tick > 0) {
    // giữ pause cục bộ nếu server v1.0 chưa hỗ trợ state paused
  }

  // Phát hiện đổi pha tự động trong --mode day (gather -> quan -> shop -> gather ngày kế)
  if (uiScreen !== "menu" && uiScreen !== "quit") {
    if (lastPhaseKey && lastPhaseKey !== phaseKey && !snap.finished) {
      if (ph === "quan") {
        uiScreen = "evening_intro";
        introTimer = 3.5;
        renderModal();
      } else if (ph === "shop") {
        uiScreen = "day_result";
        introTimer = 3.5;
        renderModal();
      } else if (ph === "gather") {
        uiScreen = "intro";
        introTimer = 4.0;
        sessionStats.servedCount = 0;
        sessionStats.leftCount = 0;
        sessionStats.tipsTotal = 0;
        sessionStats.dayEarned = 0;
        renderModal();
      }
    }
    if (ph === "shop" && uiScreen === "playing") {
      uiScreen = "shop";
      renderModal();
    }
    if (snap.finished && uiScreen !== "summary") {
      uiScreen = "summary";
      renderModal();
    }
  }
  lastPhaseKey = phaseKey;

  // Quét các sự kiện mới để kích hoạt VFX + SFX
  const evs = snap.events || [];
  if (!evs.length) return;
  let startIdx = 0;
  if (lastProcessedEventKey) {
    for (let i = evs.length - 1; i >= 0; i--) {
      const ek = `${evs[i].tick}|${evs[i].name}|${JSON.stringify(evs[i].data)}`;
      if (ek === lastProcessedEventKey) { startIdx = i + 1; break; }
    }
  } else {
    startIdx = evs.length; // bỏ qua lịch sử cũ khi vừa mở trang
  }

  for (let i = startIdx; i < evs.length; i++) {
    const e = evs[i];
    onGameEvent(e);
  }
  const last = evs[evs.length - 1];
  lastProcessedEventKey = `${last.tick}|${last.name}|${JSON.stringify(last.data)}`;
}

function onGameEvent(e) {
  const d = e.data || {};
  const px = snap && snap.player ? lastTransform.sx(snap.player.pos[0]) : innerWidth / 2;
  const py = snap && snap.player ? lastTransform.sy(snap.player.pos[1]) : innerHeight / 2;

  AudioEngine.playSfx(e.name);

  switch (e.name) {
    case "dive":
      spawnParticles(px, py, "#7dd3fc", 16, 2.8, 0.55, 3);
      spawnRipple(px, py, "#bae6fd", 48);
      break;
    case "surface":
      spawnParticles(px, py, "#e0f2fe", 14, 2.5, 0.5, 3);
      spawnText(px, py - 24, "💨 Hồi Oxy!", "#4ade80", 15);
      break;
    case "gather":
      spawnParticles(px, py, kc(d.kind), 18, 3.4, 0.65, 4);
      spawnRipple(px, py, kc(d.kind), 56);
      spawnText(px, py - 26, `+${d.amount} ${kName(d.kind)}`, "#fde047", 17);
      break;
    case "fish_caught":

      if (prefs.creative) {
        const ax = lastTransform.sx(vfx.aquaman.x);
        const ay = lastTransform.sy(vfx.aquaman.d);
        spawnBeam(px, py, ax, ay, "#38bdf8", "#fef08a", 16);
        vfx.aquaman.hurtFlash = 1.0;
        vfx.aquaman.hp = Math.max(10, vfx.aquaman.hp - 15);
        if (vfx.aquaman.hp <= 10) vfx.aquaman.hp = 100;
        vfx.aquaman.speech = `A-Qua-Mèn: Ê Út Sen! Trả ${kName(d.kind)} lại cho trẫm!`;
        vfx.aquaman.speechTimer = 3.2;
        addShake(6);
      }
      break;
    case "hold_full":
      spawnText(px, py - 28, "⚠ GIỎ ĐẦY!", "#fb923c", 18);
      addShake(4);
      break;
    case "oxygen_empty":
      spawnText(px, py - 32, "⚠ HẾT HƠI! NỔI LÊN NGAY!", "#ef4444", 20);
      addShake(7);
      break;
    case "choke":
      spawnParticles(px, py, "#ef4444", 20, 3.6, 0.7, 4);
      spawnText(px, py - 32, `💔 NGẠT NƯỚC -1 MÁU!`, "#ef4444", 20);
      addShake(11);
      break;
    case "monster_hit":
      spawnParticles(px, py, "#a855f7", 28, 5.0, 0.85, 4.5);
      spawnText(px, py - 34, `🐊 BỊ ĐÁNH! -1 MÁU (Rơi ${(d.lost || []).length})`, "#f43f5e", 20);
      addShake(14);
      if (prefs.creative) {
        vfx.aquaman.speech = "A-Qua-Mèn: Hahaha! Thấy uy lực Đinh Ba sông Chín Khúc chưa!";
        vfx.aquaman.speechTimer = 3.2;
      }
      break;
    case "cook_started":
      spawnParticles(px, py, "#f97316", 18, 3.2, 0.65, 4);
      spawnText(px, py - 26, `🔥 Nấu ${dName(d.dish_id)}`, "#fb923c", 16);
      break;
    case "dish_ready":
      spawnText(px, py - 30, `✨ ${dName(d.dish_id)} ĐÃ CHÍN!`, "#4ade80", 18);
      break;
    case "served": {
      sessionStats.servedCount++;
      sessionStats.dishCounts[d.dish_id] = (sessionStats.dishCounts[d.dish_id] || 0) + 1;
      const tb = (snap.tables || []).find((t) => t.id === d.table_id);
      const tx = tb ? lastTransform.sx(tb.pos[0]) : px;
      const ty = tb ? lastTransform.sy(tb.pos[1]) : py;
      spawnParticles(tx, ty, "#fde047", 26, 4.4, 0.8, 4.5);
      spawnRipple(tx, ty, "#4ade80", 72);
      if (prefs.creative) {
        spawnBeam(px, py, tx, ty, "#38bdf8", "#fde047", 20);
        addShake(8);
        vfx.goku.powerBurst = 1.4;
        vfx.goku.speech = `GÔ-KU SSJ3: Woa!! ${dName(d.dish_id)} ngon hết sảy!!`;
        vfx.goku.speechTimer = 3.4;
        spawnText(tx, ty - 42, `⚡ KAMEHAME-LẨU! ${d.tip > 0 ? "+BOA " + d.tip + "k!" : ""}`, "#fde047", 19);
      } else {
        spawnText(tx, ty - 34, `🍲 Đã phục vụ! ${d.tip > 0 ? "+Boa " + d.tip + "k" : ""}`, "#4ade80", 17);
      }
      break;
    }
    case "paid": {
      sessionStats.tipsTotal += (d.tip || 0);
      sessionStats.dayEarned += (d.amount || 0);
      const tb = (snap.tables || []).find((t) => t.id === d.table_id);
      const tx = tb ? lastTransform.sx(tb.pos[0]) : px;
      const ty = tb ? lastTransform.sy(tb.pos[1]) : py;
      spawnParticles(tx, ty, "#facc15", 28, 4.8, 0.9, 4.5);
      spawnText(tx, ty - 38, `💰 +${d.amount}k${d.tip > 0 ? " (BOA +" + d.tip + "k ★)" : ""}`, "#facc15", 20);
      break;
    }
    case "customer_arrived":
      if (prefs.creative) {
        vfx.goku.powerBurst = 1.1;
        vfx.goku.speech = `GÔ-KU SSJ3: Cho ta phần ${dName(d.dish_id)} thiệt nóng nha Út Sen!`;
        vfx.goku.speechTimer = 3.5;
      }
      break;
    case "customer_left":
      if (d.reason === "patience") {
        sessionStats.leftCount++;
        addShake(9);
        if (prefs.creative) {
          vfx.goku.speech = "GÔ-KU SSJ3: Chờ lâu quá ta bay đi hành tinh khác ăn đây!";
          vfx.goku.speechTimer = 3.0;
        }
      }
      break;
    case "bought":
      if (uiScreen === "shop") renderModal();
      break;
  }
}

// ---------- Poll snapshot từ backend ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    processEventsAndPhases();
    if (uiScreen === "shop") renderShopBodyOnly();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();
