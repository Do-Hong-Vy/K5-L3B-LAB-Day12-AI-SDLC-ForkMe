// ============================================================================
// TIỆN ÍCH VẼ CANVAS 2.5D & DỮ LIỆU
// ============================================================================
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  const weight = o.bold ? "700 " : (o.semi ? "600 " : "");
  ctx.font = weight + (o.size || 16) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = o.color || "#f8fafc";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.75)";
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 1.5;
    ctx.fillText(s, x, y);
    ctx.restore();
  } else {
    ctx.fillText(s, x, y);
  }
}
function roundRect(x, y, w, h, r = 8) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function panel(x, y, w, h, o = {}) {
  roundRect(x, y, w, h, o.r || 10);
  ctx.fillStyle = o.bg || "rgba(10, 19, 32, 0.86)";
  ctx.fill();
  ctx.lineWidth = o.lw || 1.3;
  ctx.strokeStyle = o.border || "rgba(246, 196, 83, 0.30)";
  ctx.stroke();
}
function bar(x, y, w, h, frac, color, label, o = {}) {
  const clamped = Math.max(0, Math.min(1, frac || 0));
  roundRect(x, y, w, h, o.r || 6);
  ctx.fillStyle = o.bg || "rgba(0, 0, 0, 0.58)";
  ctx.fill();
  if (clamped > 0) {
    roundRect(x, y, Math.max(4, w * clamped), h, o.r || 6);
    ctx.fillStyle = color;
    ctx.fill();
  }
  if (o.marker !== undefined) {
    const mx = x + w * o.marker;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, y - 1); ctx.lineTo(mx, y + h + 1); ctx.stroke();
  }
  roundRect(x + 0.5, y + 0.5, w - 1, h - 1, o.r || 6);
  ctx.strokeStyle = o.border || "rgba(255, 255, 255, 0.35)";
  ctx.lineWidth = 1;
  ctx.stroke();
  if (label) {
    text(label, x + w / 2, y + h / 2 + (o.fontSize || 12) * 0.36, {
      size: o.fontSize || 12, align: "center", bold: true, color: "#ffffff", shadow: true
    });
  }
}
function fmtTime(ticks) {
  const s = Math.max(0, Math.ceil((ticks || 0) / 60));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
// v1.2 (Ticket-03): giỏ/kho là mảng cá thể {id, kind, fresh}; v1.1 là mảng kind / map đếm. Đếm chung cả hai.
const SPOIL_BELOW = 30;
function countItems(arr, skipSpoiled) {
  const out = {};
  (arr || []).forEach((x) => {
    const k = (x && typeof x === "object") ? x.kind : x;
    if (skipSpoiled && x && typeof x === "object" && x.fresh < SPOIL_BELOW) return;
    out[k] = (out[k] || 0) + 1;
  });
  return out;
}
function stockCounts(stock, skipSpoiled) {
  return Array.isArray(stock) ? countItems(stock, skipSpoiled) : Object.assign({}, stock || {});
}
function getActiveMenu() {
  const full = getFullMenu();
  if (snap && snap.day_plan && snap.day_plan.dishes) {
    const sub = {};
    Object.keys(snap.day_plan.dishes).forEach((id) => {
      if (full[id]) sub[id] = full[id];
    });
    if (Object.keys(sub).length) return sub;
  }
  return full;
}
function computeAvailableStock() {
  if (!snap) return { stock: {}, reserved: {}, avail: {} };
  if (activePhase() === "gather") {
    const c = countItems(snap.hold || []);
    return { stock: c, reserved: {}, avail: c };
  }
  // v1.2: kho khả dụng = cá thể chưa ươn − phần giữ (reserved là mảng id cá thể)
  const stock = stockCounts(snap.stock, true);
  const byId = {};
  if (Array.isArray(snap.stock)) snap.stock.forEach((it) => { byId[it.id] = it; });
  const reserved = {};
  (snap.customers || []).forEach((c) => {
    const r = c.reserved || {};
    if (Array.isArray(r)) {
      r.forEach((iid) => { const it = byId[iid]; if (it) reserved[it.kind] = (reserved[it.kind] || 0) + 1; });
    } else {
      Object.keys(r).forEach((k) => { reserved[k] = (reserved[k] || 0) + r[k]; });
    }
  });
  const avail = {};
  const allKeys = new Set([...Object.keys(stock), ...Object.keys(reserved)]);
  allKeys.forEach((k) => { avail[k] = Math.max(0, (stock[k] || 0) - (reserved[k] || 0)); });
  return { stock, reserved, avail };
}
function canCookCount(recipe, avail) {
  let maxP = Infinity;
  for (const [k, req] of Object.entries(recipe)) {
    maxP = Math.min(maxP, Math.floor((avail[k] || 0) / req));
  }
  return maxP === Infinity ? 0 : maxP;
}

// ---------- VẼ NHÂN VẬT ĐỈNH CAO: A-QUA-MÈN (DƯỚI SÔNG) ----------
function drawAquamanBoss(cx, cy, s, tNow, facingRight = true, chasing = false) {
  const scale = Math.max(0.85, s / 15);
  ctx.save();
  ctx.translate(cx, cy);

  // Vòng xoáy năng lượng thủy triều 2.5D phía sau
  const auraR = (chasing ? 3.2 : 2.3) * s;
  const auraG = ctx.createRadialGradient(0, 0, 0.3 * s, 0, 0, auraR);
  auraG.addColorStop(0, chasing ? "rgba(168, 85, 247, 0.55)" : "rgba(56, 189, 248, 0.42)");
  auraG.addColorStop(0.6, "rgba(14, 165, 233, 0.18)");
  auraG.addColorStop(1, "rgba(14, 165, 233, 0)");
  ctx.fillStyle = auraG;
  ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI * 2); ctx.fill();

  // Vòng sóng năng lượng xoay
  ctx.strokeStyle = chasing ? "rgba(216, 180, 254, 0.75)" : "rgba(125, 211, 252, 0.6)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, auraR * 0.78, auraR * 0.32, Math.sin(tNow * 2) * 0.25, tNow * 2, tNow * 2 + Math.PI * 1.4);
  ctx.stroke();

  ctx.save();
  if (!facingRight) ctx.scale(-1, 1);
  const bob = Math.sin(tNow * 4) * 3;
  ctx.translate(0, bob);

  // Tóc dài nâu vàng bồng bềnh dưới nước
  ctx.fillStyle = "#92400e";
  ctx.beginPath();
  ctx.moveTo(-4 * scale, -18 * scale);
  ctx.quadraticCurveTo(-22 * scale, -14 * scale + Math.sin(tNow * 6) * 4, -24 * scale, 2 * scale);
  ctx.quadraticCurveTo(-12 * scale, 4 * scale, -4 * scale, -6 * scale);
  ctx.closePath();
  ctx.fill();

  // Chân giáp xanh ngọc
  ctx.fillStyle = "#047857";
  ctx.fillRect(-7 * scale, 10 * scale, 6 * scale, 14 * scale);
  ctx.fillRect(1 * scale, 10 * scale, 6 * scale, 14 * scale);

  // Thân áo giáp vảy rồng vàng hoàng kim
  const armorGrad = ctx.createLinearGradient(-10 * scale, -10 * scale, 10 * scale, 12 * scale);
  armorGrad.addColorStop(0, "#fde047");
  armorGrad.addColorStop(0.5, "#f59e0b");
  armorGrad.addColorStop(1, "#b45309");
  ctx.fillStyle = vfx.aquaman.hurtFlash > 0.2 ? "#ffffff" : armorGrad;
  roundRect(-10 * scale, -10 * scale, 20 * scale, 22 * scale, 6 * scale);
  ctx.fill();
  ctx.strokeStyle = "#fef08a";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Thắt lưng chữ A Hoàng Kim
  ctx.fillStyle = "#065f46";
  ctx.fillRect(-10 * scale, 7 * scale, 20 * scale, 5 * scale);
  ctx.fillStyle = "#fde047";
  ctx.beginPath(); ctx.moveTo(0, 6 * scale); ctx.lineTo(-4 * scale, 12 * scale); ctx.lineTo(4 * scale, 12 * scale); ctx.closePath(); ctx.fill();

  // Đầu & Râu quai nón oai phong
  ctx.fillStyle = "#fdba74";
  ctx.beginPath(); ctx.arc(0, -17 * scale, 8.5 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#78350f";
  ctx.beginPath(); ctx.arc(0, -14 * scale, 7.5 * scale, 0.15, Math.PI - 0.15); ctx.fill();
  // Mắt phát sáng
  ctx.fillStyle = chasing ? "#f43f5e" : "#38bdf8";
  ctx.beginPath(); ctx.arc(3.5 * scale, -18 * scale, 2 * scale, 0, Math.PI * 2); ctx.fill();

  // CÂY ĐINH BA HOÀNG KIM (TRIDENT) phát tia sét nước!
  ctx.save();
  ctx.translate(14 * scale, -4 * scale);
  ctx.rotate(Math.sin(tNow * 5) * 0.12 - 0.18);
  ctx.shadowColor = "#38bdf8";
  ctx.shadowBlur = 14;
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 3.2 * scale;
  ctx.beginPath(); ctx.moveTo(0, 22 * scale); ctx.lineTo(0, -24 * scale); ctx.stroke();
  // 3 ngạnh đinh ba
  ctx.beginPath();
  ctx.moveTo(-7 * scale, -15 * scale); ctx.lineTo(-7 * scale, -27 * scale);
  ctx.moveTo(7 * scale, -15 * scale); ctx.lineTo(7 * scale, -27 * scale);
  ctx.moveTo(-7 * scale, -15 * scale); ctx.lineTo(7 * scale, -15 * scale);
  ctx.moveTo(0, -24 * scale); ctx.lineTo(0, -32 * scale);
  ctx.stroke();
  ctx.restore();
  ctx.restore();

  // Thanh Boss Name & HP bar phía trên A-Qua-Mèn
  text("🔱 A-QUA-MÈN — THỦY THẦN CHÍN KHÚC", 0, -34 * scale, { size: 12, align: "center", bold: true, color: "#fde047", shadow: true });
  bar(-48, -30 * scale, 96, 8, vfx.aquaman.hp / vfx.aquaman.maxHp, "#38bdf8", "", { r: 4 });

  // Bong bóng thoại của A-Qua-Mèn
  if (vfx.aquaman.speechTimer > 0 && vfx.aquaman.speech) {
    const bw = Math.min(310, vfx.aquaman.speech.length * 7.2 + 24);
    panel(-bw / 2, -64 * scale, bw, 26, { bg: "rgba(12, 24, 44, 0.94)", border: "#38bdf8", r: 8 });
    text(vfx.aquaman.speech, 0, -47 * scale, { size: 12, align: "center", bold: true, color: "#e0f2fe" });
  }
  ctx.restore();
}

// ---------- VẼ NHÂN VẬT ĐỈNH CAO: GÔ-KU SSJ3 (TRÊN NHÀ BÈ) ----------
function drawGokuSSJ3(cx, cy, s, tNow, angry = false, eating = false) {
  const scale = Math.max(0.85, s / 42);
  const boost = angry || vfx.goku.powerBurst > 0;
  ctx.save();
  ctx.translate(cx, cy);

  // 1. Hào quang Ki Siêu Xay-Da Cấp 3 nhiều lớp bùng nổ!
  const auraR = (boost ? 56 : 42) * scale + Math.sin(tNow * 18) * 5;
  const kiGrad = ctx.createRadialGradient(0, 0, 6 * scale, 0, 0, auraR);
  kiGrad.addColorStop(0, "rgba(254, 249, 195, 0.92)");
  kiGrad.addColorStop(0.45, boost ? "rgba(250, 204, 21, 0.65)" : "rgba(250, 204, 21, 0.42)");
  kiGrad.addColorStop(0.8, "rgba(245, 158, 11, 0.16)");
  kiGrad.addColorStop(1, "rgba(245, 158, 11, 0)");
  ctx.fillStyle = kiGrad;
  ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI * 2); ctx.fill();

  // Lửa Ki nhọn bốc quanh người
  ctx.fillStyle = "rgba(253, 224, 71, 0.45)";
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2 + tNow * 1.4;
    const r1 = (24 + Math.sin(tNow * 15 + i * 2) * 6) * scale;
    const r2 = (boost ? 46 : 34) * scale;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang - 0.18) * r1 * 0.7, Math.sin(ang - 0.18) * r1 * 0.7);
    ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
    ctx.lineTo(Math.cos(ang + 0.18) * r1 * 0.7, Math.sin(ang + 0.18) * r1 * 0.7);
    ctx.closePath();
    ctx.fill();
  }

  // 2. Bóng đổ 2.5D xuống sàn gỗ
  ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
  ctx.beginPath(); ctx.ellipse(0, 18 * scale, 18 * scale, 7 * scale, 0, 0, Math.PI * 2); ctx.fill();

  // 3. MÁI TÓC VÀNG DÀI KHỔNG LỒ ĐẶC TRƯNG SSJ3 (nhiều tầng nhọn bay phấp phới!)
  const hairWave = Math.sin(tNow * 10) * 3 * scale;
  const hairGrad = ctx.createLinearGradient(0, -24 * scale, 0, 24 * scale);
  hairGrad.addColorStop(0, "#fef08a");
  hairGrad.addColorStop(0.5, "#facc15");
  hairGrad.addColorStop(1, "#ca8a04");
  ctx.fillStyle = hairGrad;
  ctx.strokeStyle = "#a16207";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, -26 * scale);
  ctx.lineTo(-14 * scale, -18 * scale);
  ctx.lineTo(-22 * scale + hairWave, -4 * scale);
  ctx.lineTo(-15 * scale, 2 * scale);
  ctx.lineTo(-23 * scale - hairWave, 16 * scale);
  ctx.lineTo(-10 * scale, 14 * scale);
  ctx.lineTo(-6 * scale + hairWave, 27 * scale);
  ctx.lineTo(0, 19 * scale);
  ctx.lineTo(6 * scale - hairWave, 27 * scale);
  ctx.lineTo(10 * scale, 14 * scale);
  ctx.lineTo(23 * scale + hairWave, 16 * scale);
  ctx.lineTo(15 * scale, 2 * scale);
  ctx.lineTo(22 * scale - hairWave, -4 * scale);
  ctx.lineTo(14 * scale, -18 * scale);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 4. Võ phục cam-xanh của Goku
  ctx.fillStyle = "#ea580c";
  roundRect(-11 * scale, -4 * scale, 22 * scale, 20 * scale, 6 * scale);
  ctx.fill();
  ctx.fillStyle = "#1d4ed8";
  ctx.fillRect(-11 * scale, 7 * scale, 22 * scale, 4.5 * scale);
  ctx.beginPath(); ctx.moveTo(-5 * scale, -4 * scale); ctx.lineTo(0, 4 * scale); ctx.lineTo(5 * scale, -4 * scale); ctx.closePath(); ctx.fill();

  // 5. Khuôn mặt chuẩn SSJ3 (trán gồ không lông mày + mắt xanh lục bảo cực ngầu!)
  ctx.fillStyle = "#fed7aa";
  ctx.beginPath(); ctx.arc(0, -12 * scale, 9.5 * scale, 0, Math.PI * 2); ctx.fill();
  // Tóc mái chữ V vàng rủ xuống trán (đặc trưng SSJ3)
  ctx.fillStyle = "#fde047";
  ctx.beginPath();
  ctx.moveTo(-9 * scale, -19 * scale);
  ctx.lineTo(0, -13 * scale);
  ctx.lineTo(9 * scale, -19 * scale);
  ctx.lineTo(4 * scale, -26 * scale);
  ctx.lineTo(-4 * scale, -26 * scale);
  ctx.closePath();
  ctx.fill();
  // Đôi mắt xanh ngọc lục bảo
  ctx.fillStyle = "#10b981";
  ctx.fillRect(-5 * scale, -13 * scale, 3.2 * scale, 2.4 * scale);
  ctx.fillRect(1.8 * scale, -13 * scale, 3.2 * scale, 2.4 * scale);

  // Hiệu ứng ăn siêu tốc nếu đang eating
  if (eating) {
    const ch = Math.sin(tNow * 35) * 6 * scale;
    ctx.strokeStyle = "#fde68a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-14 * scale, -2 * scale); ctx.lineTo(-4 * scale, -7 * scale + ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14 * scale, -2 * scale); ctx.lineTo(4 * scale, -7 * scale - ch); ctx.stroke();
  }

  // 6. TIA SÉT XANH ĐIỆN CAO THẾ SSJ3 GIẬT LÁCH TÁCH!
  const boltCount = boost ? 5 : 2;
  ctx.strokeStyle = "#38bdf8";
  ctx.shadowColor = "#38bdf8";
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2;
  for (let i = 0; i < boltCount; i++) {
    if (Math.sin(tNow * 24 + i * 7.3) > (boost ? -0.3 : 0.35)) {
      const a0 = ((tNow * 3 + i * 1.9) % 6.28);
      const x0 = Math.cos(a0) * 16 * scale, y0 = Math.sin(a0) * 16 * scale;
      const xm = x0 * 1.45 + (Math.random() - 0.5) * 14, ym = y0 * 1.45 + (Math.random() - 0.5) * 14;
      const x1 = x0 * 2.1 + (Math.random() - 0.5) * 12, y1 = y0 * 2.1 + (Math.random() - 0.5) * 12;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(xm, ym); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;

  // Thoại của Gô-Ku SSJ3
  if (vfx.goku.speechTimer > 0 && vfx.goku.speech) {
    const bw = Math.min(320, vfx.goku.speech.length * 7.0 + 26);
    panel(-bw / 2, 26 * scale, bw, 26, { bg: "rgba(15, 23, 42, 0.95)", border: "#fde047", r: 8 });
    text(vfx.goku.speech, 0, 43 * scale, { size: 12, align: "center", bold: true, color: "#fef08a" });
  }
  ctx.restore();
}

// ---------- VẼ THỦY QUÁI (CÁ SẤU NĂM CHÈO / RẮN HỔ MÂY) ----------
function drawMonster(m, sx, sy, s, tNow) {
  const mx = sx(m.pos[0]), my = sy(m.pos[1]);
  const chasing = m.state === "chase";
  const stunned = m.state === "stunned";
  const recoil = m.state === "recoil";

  // Nếu bật Chế độ Sáng tạo và là M1: vẽ A-Qua-Mèn cưỡi sóng uy phong ngay vị trí M1!
  if (prefs.creative && m.id === "M1") {
    const facingRight = m.waypoints && m.waypoints[m.target_idx] ? (m.waypoints[m.target_idx][0] >= m.pos[0]) : true;
    drawAquamanBoss(mx, my, s, tNow, facingRight, chasing);
    if (chasing) {
      text("⚡ ĐANG RƯỢT ĐUỔI!", mx, my + 2.4 * s, { size: 12, align: "center", bold: true, color: "#f43f5e", shadow: true });
    }
    return;
  }

  ctx.save();
  ctx.translate(mx, my);
  // Vòng nguy hiểm phát hiện
  if (chasing) {
    ctx.fillStyle = `rgba(168, 85, 247, ${0.22 + 0.14 * Math.sin(tNow * 10)})`;
    ctx.beginPath(); ctx.arc(0, 0, 2.2 * s, 0, Math.PI * 2); ctx.fill();
  }
  // Thân Cá Sấu / Rắn
  const col = stunned ? "#94a3b8" : (m.kind === "ran" ? "#7e22ce" : (chasing ? "#dc2626" : "#15803d"));
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.72 * s, 0, 0, Math.PI * 2); ctx.fill();
  // Đuôi quẫy
  const tailW = Math.sin(tNow * (chasing ? 14 : 6)) * 0.45 * s;
  ctx.beginPath();
  ctx.moveTo(-1.5 * s, 0);
  ctx.lineTo(-2.7 * s, -0.5 * s + tailW);
  ctx.lineTo(-2.7 * s, 0.5 * s + tailW);
  ctx.closePath();
  ctx.fill();
  // Mắt đỏ rực
  ctx.fillStyle = chasing ? "#fde047" : "#ef4444";
  ctx.beginPath(); ctx.arc(1.1 * s, -0.22 * s, 0.2 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const label = `${m.id} ${m.kind === "ran" ? "Rắn Hổ Mây" : "Cá Sấu"} (${m.state})`;
  text(label, mx, my - 1.15 * s, { size: 11, align: "center", bold: true, color: chasing ? "#fca5a5" : "#d8b4fe", shadow: true });
}

// ---------- BẢNG SỔ TAY THỰC ĐƠN (6 MÓN HOẶC KẾ HOẠCH NGÀY) ----------
function drawRecipeCard(w, h) {
  if (!showHelp) return;
  const { avail } = computeAvailableStock();
  const menu = getActiveMenu();
  const entries = Object.entries(menu);
  const cw = 304, rowH = 34, ch = 36 + entries.length * rowH + 8;
  const cx = w - cw - 14, cy = 62;
  panel(cx, cy, cw, ch, { bg: "rgba(10, 19, 32, 0.90)", border: "rgba(246, 196, 83, 0.42)" });
  const title = snap && snap.day_plan ? `📖 KẾ HOẠCH NGÀY ${snap.day || 1} (MÁ TƯ)` : "📖 SỔ TAY THỰC ĐƠN MÁ TƯ";
  text(title, cx + 12, cy + 22, { size: 13, bold: true, color: "#fde047" });

  entries.forEach(([id, info], idx) => {
    const ry = cy + 34 + idx * rowH;
    const portions = canCookCount(info.recipe, avail);
    const planTarget = snap && snap.day_plan && snap.day_plan.dishes ? snap.day_plan.dishes[id] : null;
    roundRect(cx + 8, ry - 2, cw - 16, rowH - 4, 6);
    ctx.fillStyle = portions > 0 ? "rgba(34, 197, 94, 0.16)" : "rgba(255, 255, 255, 0.04)";
    ctx.fill();
    const labelName = planTarget ? `${dName(id)} (cần ${planTarget})` : dName(id);
    text(labelName, cx + 14, ry + 11, { size: 12, bold: true, color: portions > 0 ? "#f8fafc" : "#cbd5e1" });
    text(`${info.price}k · ${info.cook_s}s`, cx + cw - 14, ry + 11, { size: 11, align: "right", bold: true, color: "#facc15" });
    const ingStr = Object.entries(info.recipe).map(([k, n]) => `${KIND_SHORT[k] || kName(k)}×${n}`).join(" + ");
    text(ingStr, cx + 14, ry + 24, { size: 11, color: "#94a3b8" });
    text(portions > 0 ? `Nấu ×${portions}` : "Thiếu NL", cx + cw - 14, ry + 24, {
      size: 11, align: "right", bold: true, color: portions > 0 ? "#4ade80" : "#64748b"
    });
  });
}

// ---------- NHẬT KÝ SỰ KIỆN TIẾNG VIỆT ----------
function formatEventVN(e) {
  const d = e.data || {};
  switch (e.name) {
    case "dive": return { msg: `Lặn xuống nước (d=${d.pos ? d.pos[1].toFixed(1) : "?"}m)`, col: "#38bdf8" };
    case "surface": return { msg: `Nổi lên mặt nước — Hồi Oxy`, col: "#4ade80" };
    case "oxygen_empty": return { msg: `HẾT HƠI! Mau nổi lên mặt nước!`, col: "#fb7185" };
    case "choke": return { msg: `Ngạt nước! -1 Máu (còn ${d.hp} ♥)`, col: "#ef4444" };
    case "monster_hit": return { msg: `Thủy quái ${d.monster_id} tấn công! -1♥ (rơi ${(d.lost || []).length})`, col: "#c084fc" };
    case "faint": return { msg: `Ngất xỉu (${d.cause})! Mất sạch giỏ`, col: "#ef4444" };
    case "gather": return { msg: `Hái ${d.node_id}: +${d.amount} ${kName(d.kind)}`, col: "#facc15" };
    case "node_regrown": return { msg: `Nút ${d.node_id} đã mọc lại!`, col: "#86efac" };
    case "fish_caught": return { msg: `Bắt ${d.fish_id}: +${d.yield} ${kName(d.kind)}`, col: "#38bdf8" };
    case "fish_spawned": return { msg: `Đàn ${d.id} (${kName(d.kind)}) vừa bơi tới!`, col: "#7dd3fc" };
    case "hold_full": return { msg: `Giỏ đầy! Cần ${d.required} ô, còn ${d.free} ô`, col: "#fb923c" };
    case "customer_arrived": return { msg: `Khách ${d.order_id} (${d.table_id}) gọi ${dName(d.dish_id)}`, col: "#fde047" };
    case "no_dish": return { msg: `Khách ghé nhưng kho thiếu nguyên liệu!`, col: "#fb923c" };
    case "cook_started": return { msg: `Bếp ${d.stove_id} nấu ${dName(d.dish_id)} (${d.order_id})`, col: "#f59e0b" };
    case "dish_ready": return { msg: `Bếp ${d.stove_id}: ${dName(d.dish_id)} ĐÃ CHÍN!`, col: "#4ade80" };
    case "dish_picked": return { msg: `Bưng ${dName(d.dish_id)} (${d.order_id}) lên tay`, col: "#38bdf8" };
    case "served": return { msg: `Phục vụ ${d.table_id}: ${dName(d.dish_id)} (Boa +${d.tip}k)`, col: "#4ade80" };
    case "paid": return { msg: `Thu bàn ${d.table_id}: +${d.amount}k (Boa +${d.tip}k)`, col: "#facc15" };
    case "customer_left": return { msg: `Khách ${d.order_id} rời bàn (${d.reason === "patience" ? "Hết kiên nhẫn -0.5★" : "Đóng ca"})`, col: d.reason === "patience" ? "#ef4444" : "#94a3b8" };
    case "bought": return { msg: `Mua nâng cấp ${d.upgrade} Lv.${d.level} (-${d.price}k)`, col: "#4ade80" };
    default: return { msg: `${e.name}`, col: "#cbd5e1" };
  }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  if (!ev.length) return;
  const lw = 350, lh = ev.length * 19 + 26;
  const lx = w - lw - 14, ly = h - lh - 86;
  panel(lx, ly, lw, lh, { bg: "rgba(9, 17, 29, 0.80)", border: "rgba(148, 163, 184, 0.22)", r: 8 });
  text("NHẬT KÝ SỰ KIỆN", lx + 10, ly + 16, { size: 11, bold: true, color: "#94a3b8" });
  ev.forEach((e, i) => {
    const info = formatEventVN(e);
    const y = ly + 33 + i * 18;
    text(`t${e.tick}`, lx + 10, y, { size: 11, color: "#64748b", bold: true });
    const clipped = info.msg.length > 43 ? info.msg.slice(0, 41) + "…" : info.msg;
    text(clipped, lx + 50, y, { size: 12, color: info.col });
  });
}

// ============================================================================
// CẢNH 1: BUỔI SÁNG — SÔNG CHÍN KHÚC 2.5D + A-QUA-MÈN (GATHER)
// ============================================================================
function drawGather(w, h, dt) {
  const meta = getPhaseMeta("gather");
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6.5;
  const top = 74, bottom = 84;
  const s = Math.max(1, Math.min((w - 26) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  lastTransform = { sx, sy, s };
  const surfD = meta.surface_depth !== undefined ? meta.surface_depth : 0.5;
  const tNow = performance.now() * 0.001;

  // 1. Bầu trời hừng đông 2.5D + Mặt trời + Mây trôi + Rặng dừa nước 2 tầng parallax
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#fb923c");
  skyGrad.addColorStop(0.45, "#fde68a");
  skyGrad.addColorStop(1, "#bae6fd");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, top, w, oy - top);

  // Mặt trời rực rỡ với quầng sáng
  const sunX = sx(84), sunY = oy - 3.3 * s;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 0.5 * s, sunX, sunY, 6 * s);
  sunGlow.addColorStop(0, "rgba(255, 251, 235, 0.95)");
  sunGlow.addColorStop(0.4, "rgba(251, 146, 60, 0.45)");
  sunGlow.addColorStop(1, "rgba(251, 146, 60, 0)");
  ctx.fillStyle = sunGlow;
  ctx.beginPath(); ctx.arc(sunX, sunY, 6 * s, 0, Math.PI * 2); ctx.fill();

  // Rặng dừa nước miền Tây đung đưa
  for (let i = 0; i < 14; i++) {
    const bx = sx(6 + i * 7.2);
    const sway = Math.sin(tNow * 1.5 + i) * 0.25 * s;
    ctx.fillStyle = i % 2 === 0 ? "rgba(21, 128, 61, 0.40)" : "rgba(22, 101, 52, 0.30)";
    ctx.beginPath();
    ctx.ellipse(bx + sway, oy - 0.6 * s, 3.2 * s, 2.2 * s, 0, Math.PI, 0);
    ctx.fill();
  }

  // 2. Lòng sông Chín Khúc phân 3 tầng độ sâu 2.5D (Nông <10m, Giữa 10-20m, Sâu >=20m)
  const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  waterGrad.addColorStop(0, "#2aa8d8");
  waterGrad.addColorStop(0.33, "#155e75");
  waterGrad.addColorStop(0.66, "#0c3554");
  waterGrad.addColorStop(1, "#051020");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Tia nắng 2.5D xuyên nước + cỏ đáy sông + bong bóng
  ctx.save();
  ctx.beginPath(); ctx.rect(sx(0), oy, X * s, D * s); ctx.clip();
  for (let i = 0; i < 6; i++) {
    const rx = sx(10 + i * 17 + Math.sin(tNow * 0.45 + i) * 2.2);
    const rayG = ctx.createLinearGradient(rx, oy, rx + 6 * s, sy(D * 0.78));
    rayG.addColorStop(0, "rgba(254, 240, 138, 0.18)");
    rayG.addColorStop(1, "rgba(254, 240, 138, 0)");
    ctx.fillStyle = rayG;
    ctx.beginPath();
    ctx.moveTo(rx - 2 * s, oy); ctx.lineTo(rx + 2.8 * s, oy);
    ctx.lineTo(rx + 10 * s, sy(D * 0.78)); ctx.lineTo(rx + 1.5 * s, sy(D * 0.78));
    ctx.closePath(); ctx.fill();
  }
  // Cỏ thủy sinh đung đưa ở đáy sông (d = 30m)
  ctx.strokeStyle = "rgba(34, 197, 94, 0.28)";
  ctx.lineWidth = 2.5;
  for (let x = 4; x < X; x += 5.5) {
    const wx = sx(x), wy = sy(D);
    const bend = Math.sin(tNow * 2.2 + x) * 0.9 * s;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.quadraticCurveTo(wx + bend, wy - 1.5 * s, wx + bend * 1.4, wy - 2.8 * s); ctx.stroke();
  }
  // Bong bóng
  ctx.fillStyle = "rgba(224, 242, 254, 0.28)";
  vfx.bubbles.forEach((bb) => {
    bb.d -= bb.spd;
    if (bb.d < 0.4) bb.d = D - 0.5;
    ctx.beginPath();
    ctx.arc(sx(bb.x + Math.sin(tNow * 2 + bb.ph) * 0.4), sy(bb.d), bb.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // Sóng mặt nước sin động 2.5D
  ctx.strokeStyle = "#e0f2fe";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 1) {
    const wy = oy + Math.sin(tNow * 3.5 + x * 0.45) * 2.2;
    if (x === 0) ctx.moveTo(sx(x), wy); else ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  // Vạch phân tầng độ sâu (10m: Vùng Giữa / Thủy quái, 20m: Vùng Sâu / Cá Kèo)
  const depthLabels = { 5: "5m · Nông", 10: "10m · Tầng Giữa (Cá Lóc / Cá Sấu)", 15: "15m", 20: "20m · Tầng Sâu (Cá Kèo)", 25: "25m" };
  for (let d = 5; d < D; d += 5) {
    const isZone = d === 10 || d === 20;
    ctx.strokeStyle = isZone ? "rgba(192, 132, 252, 0.28)" : "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = isZone ? 1.4 : 1;
    ctx.setLineDash(isZone ? [6, 6] : []);
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    ctx.setLineDash([]);
    text(depthLabels[d] || d + "m", sx(0) + 6, sy(d) - 4, { size: 11, bold: isZone, color: isZone ? "rgba(216, 180, 254, 0.72)" : "rgba(255, 255, 255, 0.45)" });
  }

  // 2b. Rong và đá đáy sông (sprite Kenney CC0, vị trí cố định — chỉ trang trí)
  const DECOR = [["rock_a", 8, 1.6], ["weed_a", 14, 2.2], ["weed_c", 21, 1.6], ["weed_b", 33, 2.6], ["rock_b", 40, 1.4],
                 ["weed_d", 48, 2.0], ["weed_a", 57, 2.4], ["rock_a", 66, 1.8], ["weed_c", 73, 1.6], ["weed_b", 82, 2.8],
                 ["rock_b", 91, 1.5], ["weed_d", 97, 2.0]];
  DECOR.forEach(([key, x, size], i) => {
    const img = SPRITES[key];
    if (!img) return;
    const sway = key.startsWith("weed") ? Math.sin(tNow * 1.3 + i) * 0.06 : 0;
    const hgt = size * s, wid = hgt * (img.width / img.height);
    ctx.save();
    ctx.translate(sx(x), sy(D));
    ctx.rotate(sway);
    ctx.drawImage(img, -wid / 2, -hgt, wid, hgt);
    ctx.restore();
  });

  const p = snap.player;
  const px = p ? sx(p.pos[0]) : 0, py = p ? sy(p.pos[1]) : 0;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface) : false;
  // bong bóng thở khi lặn (sprite Kenney)
  if (underwater && SPRITES.bubble_a) {
    for (let k = 0; k < 3; k++) {
      const t = (tNow * 0.8 + k / 3) % 1;
      const img = k % 2 ? SPRITES.bubble_b || SPRITES.bubble_a : SPRITES.bubble_a;
      const bs = (0.25 + 0.12 * k) * s;
      ctx.globalAlpha = 1 - t;
      ctx.drawImage(img, px + 0.3 * s + Math.sin((tNow + k) * 4) * 0.15 * s - bs / 2, py - 0.6 * s - t * 2.2 * s - bs / 2, bs, bs);
      ctx.globalAlpha = 1;
    }
  }

  // 3. Nhà sàn Bến thuyền (Dock)
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const inDock = p ? Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr : false;
  ctx.fillStyle = "#5c3a21";
  ctx.fillRect(sx(dp[0] - 1.7), sy(-0.8), 0.35 * s, 2.6 * s);
  ctx.fillRect(sx(dp[0] + 1.35), sy(-0.8), 0.35 * s, 2.6 * s);
  ctx.fillStyle = "#9a6b3f";
  ctx.fillRect(sx(dp[0] - 2.1), sy(-0.95), 4.2 * s, 0.9 * s);
  ctx.fillStyle = "#b45309";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.5), sy(-0.95)); ctx.lineTo(sx(dp[0]), sy(-3.1)); ctx.lineTo(sx(dp[0] + 2.5), sy(-0.95));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = inDock ? "#4ade80" : "rgba(253, 224, 71, 0.8)";
  ctx.lineWidth = inDock ? 2.8 : 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  text(inDock ? "⚓ NHẤN [E] CẬP BẾN!" : "⚓ Bến (E)", sx(dp[0]), sy(-3.4), {
    size: 12, align: "center", bold: true, color: inDock ? "#15803d" : "#78350f"
  });

  // 4. Các nút hái mặt nước (N1..N6: Điên điển, Bông súng, Kèo nèo)
  const intR = meta.interact_radius || 2.0;
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const dist = p ? Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) : 999;
    const inRange = !underwater && ready && dist <= intR;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.38;
    ctx.fillStyle = "#15803d";
    ctx.beginPath(); ctx.ellipse(nx, ny + 0.1 * s, 1.2 * s, 0.36 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(nx, ny - 0.25 * s, 0.9 * s, 0.48 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (inRange) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(nx, ny - 0.1 * s, 1.4 * s, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    text(`${n.id} ${KIND_SHORT[n.kind] || kName(n.kind)}`, nx, ny - 1.0 * s, {
      size: 11, align: "center", bold: true, color: inRange ? "#14532d" : "#0f172a"
    });
    if (!ready && n.regrow_ticks) {
      const regrowMax = (meta.regrow_s || 20) * 60;
      bar(nx - 16, ny + 0.5 * s, 32, 6, 1 - n.regrow_ticks / regrowMax, "#4ade80", "");
      text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 0.5 * s + 16, { size: 11, align: "center", color: "#e2e8f0", bold: true });
    } else if (inRange) {
      text("[E] Hái +1", nx, ny + 1.25 * s, { size: 12, align: "center", bold: true, color: "#fef08a", shadow: true });
    }
  });

  // 5. Đàn cá (Cá linh +3, Cá lóc +1, Cá kèo +2)
  const catchR = meta.catch_radius || 2.0;
  const yieldMap = meta.fish_yield || { ca_linh: 3, ca_loc: 1, ca_keo: 2 };
  (snap.fish || []).forEach((f) => {
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    const dist = p ? Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]) : 999;
    const inRange = underwater && dist <= catchR;
    const yld = yieldMap[f.kind] || 1;
    const wobble = Math.sin(tNow * 5 + fx * 0.04) * 0.1;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180 + wobble);
    if (inRange) {
      ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0, 0, 1.45 * s, 0, Math.PI * 2); ctx.stroke();
    }
    const sprite = SPRITES[f.kind];
    if (sprite) {  // Kenney CC0, đầu cá hướng +x như heading_deg = 0; quay sang trái thì lật dọc để cá không lộn ngược
      const deg = ((f.heading_deg || 0) % 360 + 360) % 360;
      if (deg > 90 && deg < 270) ctx.scale(1, -1);
      const wid = (f.kind === "ca_loc" ? 3.0 : 2.4) * s, hgt = wid * (sprite.height / sprite.width);
      ctx.drawImage(sprite, -wid / 2, -hgt / 2, wid, hgt);
    } else {
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 1.0 * s, 0.5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.85 * s, 0); ctx.lineTo(-1.55 * s, -0.48 * s); ctx.lineTo(-1.55 * s, 0.48 * s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath(); ctx.arc(0.55 * s, -0.14 * s, 0.13 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    text(`${f.id} ${kName(f.kind)} (+${yld})`, fx, fy - 0.9 * s, {
      size: 11, align: "center", bold: inRange, color: inRange ? "#fde047" : "#f1f5f9", shadow: true
    });
    if (inRange && p && (p.catch_cd_ticks || 0) === 0) {
      text("[Space] Bắt!", fx, fy + 1.3 * s, { size: 12, align: "center", bold: true, color: "#38bdf8", shadow: true });
    }
  });

  // 6. Cá Hô H1 (nếu bật mở rộng)
  if (snap.ca_ho) {
    const ch = snap.ca_ho;
    const hx = sx(ch.pos[0]), hy = sy(ch.pos[1]);
    ctx.save();
    ctx.translate(hx, hy);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.9 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    text(ch.photographed ? "📸 Cá Hô H1 (Đã chụp)" : "📸 Cá Hô H1 [F]", hx, hy - 1.2 * s, { size: 12, align: "center", bold: true, color: "#fde047", shadow: true });
  }

  // 7. Thủy quái (`snap.monsters[]`) HOẶC A-Qua-Mèn tuần tra (Chế độ Sáng tạo!)
  const monsters = snap.monsters || [];
  let monsterDanger = false;
  monsters.forEach((m) => {
    drawMonster(m, sx, sy, s, tNow);
    const dist = p ? Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) : 999;
    if (m.state === "chase" || dist <= 12) monsterDanger = true;
  });

  if (prefs.creative && !monsters.some((m) => m.id === "M1")) {
    // A-Qua-Mèn tuần tra oai phong ở tầng sâu để tương tác chiến đấu VFX (thuần client!)
    if (uiScreen === "playing") {
      vfx.aquaman.x += vfx.aquaman.dir * 3.8 * dt;
      if (vfx.aquaman.x > 84) { vfx.aquaman.x = 84; vfx.aquaman.dir = -1; }
      if (vfx.aquaman.x < 24) { vfx.aquaman.x = 24; vfx.aquaman.dir = 1; }
      vfx.aquaman.d = 15 + Math.sin(tNow * 1.1) * 4.5;
    }
    const distA = p ? Math.hypot(p.pos[0] - vfx.aquaman.x, p.pos[1] - vfx.aquaman.d) : 999;
    const nearA = distA <= 13;
    if (nearA && underwater) {
      monsterDanger = true;
      if (vfx.aquaman.speechTimer <= 0) {
        vfx.aquaman.speech = "A-Qua-Mèn: Dám lặn vào lãnh địa của trẫm à?! Bấm [Q] hoặc Click đấu chưởng!";
        vfx.aquaman.speechTimer = 3.5;
      }
      vfx.aquaman.tridentCooldown -= dt;
      if (vfx.aquaman.tridentCooldown <= 0 && uiScreen === "playing") {
        vfx.aquaman.tridentCooldown = 2.6;
        spawnBeam(sx(vfx.aquaman.x), sy(vfx.aquaman.d), px, py, "#0ea5e9", "#e0f2fe", 14);
        spawnRipple(px, py, "#38bdf8", 55);
        AudioEngine.playSfx("dive");
      }
    }
    drawAquamanBoss(sx(vfx.aquaman.x), sy(vfx.aquaman.d), s, tNow, vfx.aquaman.dir > 0, nearA);
  }

  // 8. Nhân vật Út Sen (Áo bà ba cam + khăn rằn + kính lặn + vệt bọt)
  if (p) {
    if (catchR && underwater) {
      ctx.strokeStyle = (p.catch_cd_ticks || 0) === 0 ? "rgba(56, 189, 248, 0.50)" : "rgba(148, 163, 184, 0.25)";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, catchR * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (intR && !underwater) {
      ctx.strokeStyle = "rgba(250, 204, 21, 0.50)";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, intR * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.save();
      ctx.translate(px, py);
      if ((p.zero_oxy_ticks || 0) > 0) {
        ctx.fillStyle = `rgba(239, 68, 68, ${0.3 + 0.25 * Math.sin(tNow * 14)})`;
        ctx.beginPath(); ctx.arc(0, 0, 1.3 * s, 0, Math.PI * 2); ctx.fill();
      }
      // Áo bà ba cam rực
      ctx.fillStyle = "#f97316";
      ctx.beginPath(); ctx.arc(0, 0, 0.72 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fef3c7"; ctx.lineWidth = 2; ctx.stroke();
      // Khăn rằn & kính lặn
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 1.05 * s, Math.sin(a) * 1.05 * s); ctx.stroke();
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath(); ctx.arc(Math.cos(a) * 0.4 * s, Math.sin(a) * 0.4 * s, 0.28 * s, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      text("Út Sen", px, py - 1.05 * s, { size: 12, align: "center", bold: true, color: "#ffffff", shadow: true });
    }
  }

  // 9. Viền cảnh báo bắt buộc theo Ticket-02: "Thủy quái!" (viền tím) & "Hết hơi!" (viền đỏ)
  const outOfOxy = p && underwater && (p.oxygen_ticks || 0) === 0;
  if (monsterDanger) {
    ctx.save();
    ctx.strokeStyle = `rgba(168, 85, 247, ${0.55 + 0.35 * Math.sin(tNow * 10)})`;
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, w - 10, h - 10);
    panel(w / 2 - 140, top + 8, 280, 34, { bg: "rgba(88, 28, 135, 0.90)", border: "#d8b4fe", r: 999 });
    text("⚠ THỦY QUÁI GẦN ĐÂY!", w / 2, top + 31, { size: 18, align: "center", bold: true, color: "#f3e8ff" });
    ctx.restore();
  }
  if (outOfOxy) {
    ctx.save();
    ctx.strokeStyle = `rgba(239, 68, 68, ${0.65 + 0.35 * Math.sin(tNow * 14)})`;
    ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, w - 12, h - 12);
    panel(w / 2 - 150, top + (monsterDanger ? 48 : 8), 300, 36, { bg: "rgba(153, 27, 27, 0.94)", border: "#fca5a5", r: 999 });
    text("🚨 HẾT HƠI! NỔI LÊN NGAY!", w / 2, top + (monsterDanger ? 72 : 32), { size: 18, align: "center", bold: true, color: "#ffffff" });
    ctx.restore();
  }

  // 10. HUD PHÍA TRÊN (Chữ chính ≥ 18px ở 1280×720 đạt AC-P2-13!)
  panel(10, 8, w - 470, 58, { r: 12 });
  const timeLow = (snap.time_left_ticks || 0) <= 30 * 60;
  text(`☀ NGÀY ${snap.day || 1} · SÁNG`, 22, 27, { size: 13, bold: true, color: "#f6c453" });
  text(`⏱ ${fmtTime(snap.time_left_ticks)}`, 22, 54, { size: 22, bold: true, color: timeLow ? "#ef4444" : "#f8fafc" });

  if (p) {
    const oxy = p.oxygen_ticks ?? 0, oxyMax = p.oxygen_max_ticks || 1800;
    const oxyRatio = oxy / oxyMax;
    const oxyLow = oxyRatio < 0.25;
    const oxyBlink = oxyLow && Math.floor(tNow * 8) % 2 === 0;
    const oxyCol = oxy === 0 ? "#ef4444" : (oxyLow ? (oxyBlink ? "#ef4444" : "#f97316") : "#38bdf8");
    bar(168, 14, 220, 22, oxyRatio, oxyCol, `OXY ${Math.ceil(oxy / 60)}s / ${Math.round(oxyMax / 60)}s`, { fontSize: 13 });

    const chokeMax = meta.choke_interval_ticks || 60;
    const zTicks = p.zero_oxy_ticks || 0;
    if (zTicks > 0 || outOfOxy) {
      bar(168, 40, 220, 18, zTicks / chokeMax, "#ef4444", `⚠ NGẠT: ${zTicks}/${chokeMax} tick`, { fontSize: 12 });
    } else {
      text(`Độ sâu: ${p.pos[1].toFixed(1)}m ${underwater ? "(Dưới nước)" : "(Mặt nước)"}`, 170, 55, { size: 13, bold: true, color: underwater ? "#7dd3fc" : "#4ade80" });
    }

    // Máu HP
    const hp = p.hp ?? 3, hpMax = p.hp_max || 3;
    let hearts = "";
    for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥" : "♡";
    text(hearts, 405, 36, { size: 24, bold: true, color: hp <= 1 ? "#ef4444" : "#fb7185" });
    const cd = p.catch_cd_ticks || 0;
    text(cd > 0 ? `Hồi vợt: ${(cd / 60).toFixed(1)}s` : "Vợt [Space]: Sẵn sàng", 405, 56, { size: 13, bold: true, color: cd > 0 ? "#94a3b8" : "#4ade80" });

    // Danh sách nguyên liệu cần lấy theo day_plan (nếu chạy --mode day)
    if (snap.day_plan && snap.day_plan.ingredients) {
      const holdMap = countItems(snap.hold || []);
      const planStr = Object.entries(snap.day_plan.ingredients).map(([k, req]) => {
        const cur = holdMap[k] || 0;
        return `${KIND_SHORT[k] || k}:${cur}/${req}${cur >= req ? "✓" : ""}`;
      }).join("  ");
      text(`Cần lấy: ${planStr}`, 555, 38, { size: 13, bold: true, color: "#fde047" });
    }
  }

  // 11. Thanh Giỏ lưới LIFO phía dưới
  const cap = snap.hold_capacity || 12;
  const hold = snap.hold || [];
  panel(10, h - 76, w - 20, 68, { r: 12 });
  text(`🧺 GIỎ LIFO (${hold.length}/${cap}):`, 22, h - 50, { size: 18, bold: true, color: hold.length >= cap ? "#fb923c" : "#fde047" });
  const counts = countItems(hold);
  const summary = Object.keys(counts).length
    ? Object.entries(counts).map(([k, n]) => `${kName(k)} ×${n}`).join(" · ")
    : "Hái rau bằng [E] ở mặt nước · Bắt cá bằng [Space] dưới nước · [Q] Tung chưởng Sáng tạo!";
  text(summary, 200, h - 50, { size: 15, color: "#f1f5f9", bold: Object.keys(counts).length > 0 });

  const slotW = Math.min(44, Math.floor((w - 430) / cap) - 4);
  for (let i = 0; i < cap; i++) {
    const sx0 = 22 + i * (slotW + 4), sy0 = h - 38;
    const raw = hold[i];
    // v1.2 (Ticket-03): cá thể {id, kind, fresh} -> màu theo kind, vạch độ tươi, ⚠ khi ươn (< 30)
    const item = raw && typeof raw === "object" ? raw.kind : raw;
    const fresh = raw && typeof raw === "object" ? raw.fresh : null;
    const spoiled = fresh !== null && fresh < SPOIL_BELOW;
    const isNewest = i === hold.length - 1 && hold.length > 0;
    roundRect(sx0, sy0, slotW, 22, 5);
    ctx.fillStyle = item ? (spoiled ? "#78716c" : kc(item)) : "rgba(255, 255, 255, 0.08)";
    ctx.fill();
    ctx.strokeStyle = isNewest ? "#ffffff" : "rgba(255, 255, 255, 0.22)";
    ctx.lineWidth = isNewest ? 2 : 1;
    ctx.stroke();
    if (item) {
      text((spoiled ? "⚠" : "") + (KIND_SHORT[item] || item), sx0 + slotW / 2, sy0 + 15,
           { size: 10, align: "center", bold: true, color: spoiled ? "#fef2f2" : "#0f172a" });
      if (fresh !== null) {
        ctx.fillStyle = fresh >= 60 ? "#22c55e" : fresh >= SPOIL_BELOW ? "#eab308" : "#ef4444";
        ctx.fillRect(sx0 + 2, sy0 + 19, Math.max(1, (slotW - 4) * fresh / 100), 2);
      }
    }
  }
  text("WASD: Bơi · [E]: Bến/Hái · [Space]: Bắt cá · [Q]: Chưởng · [R]: Chơi lại", w - 22, h - 22, {
    size: 13, align: "right", color: "#94a3b8"
  });

  drawRecipeCard(w, h);
}

// ============================================================================
// CẢNH 2: BUỔI TỐI — NHÀ BÈ MÁ TƯ 2.5D + GÔ-KU SSJ3 (QUAN)
// ============================================================================
function drawQuan(w, h) {
  const meta = getPhaseMeta("quan");
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 78, bottom = 74;
  const rightSpace = showHelp ? 330 : 30;
  const s = Math.max(1, Math.min((w - rightSpace - 30) / X, (h - top - bottom - 20) / Z));
  const ox = Math.max(22, (w - rightSpace - s * X) / 2), oy = top + 12;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  lastTransform = { sx, sy, s };
  const tNow = performance.now() * 0.001;

  // 1. Mặt sông đêm lấp lánh + ánh đèn lồng phản chiếu
  const riverNight = ctx.createRadialGradient(ox + (X * s) / 2, oy + (Z * s) / 2, s, ox + (X * s) / 2, oy + (Z * s) / 2, X * s * 1.1);
  riverNight.addColorStop(0, "#1e3a8a");
  riverNight.addColorStop(0.55, "#0f172a");
  riverNight.addColorStop(1, "#040812");
  ctx.fillStyle = riverNight;
  ctx.fillRect(0, 0, w, h);

  // Sóng nước đêm ngoài nhà bè
  ctx.strokeStyle = "rgba(125, 211, 252, 0.14)";
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 12; i++) {
    const wy = 40 + i * (h / 12);
    const wx = ((tNow * 24 + i * 130) % (w + 160)) - 80;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 55, wy); ctx.stroke();
  }

  // 2. Bóng đổ 2.5D & Khung gỗ Nhà Bè Má Tư
  roundRect(sx(0) - 4, sy(Z) + 8, X * s + 16, Z * s + 14, 14);
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fill();

  roundRect(sx(0) - 8, sy(Z) - 8, X * s + 16, Z * s + 16, 12);
  ctx.fillStyle = "#5c3a21";
  ctx.fill();

  const floorGrad = ctx.createLinearGradient(sx(0), sy(Z), sx(X), sy(0));
  floorGrad.addColorStop(0, "#d6a46c");
  floorGrad.addColorStop(0.5, "#c58f58");
  floorGrad.addColorStop(1, "#a67141");
  ctx.fillStyle = floorGrad;
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

  // Vân ván gỗ sàn bè 2.5D
  ctx.strokeStyle = "rgba(92, 58, 33, 0.24)";
  ctx.lineWidth = 1;
  for (let z = 1; z < Z; z++) {
    ctx.beginPath(); ctx.moveTo(sx(0), sy(z)); ctx.lineTo(sx(X), sy(z)); ctx.stroke();
  }
  // Khu vực bếp (nền gạch lát riêng góc trên trái)
  ctx.fillStyle = "rgba(71, 85, 105, 0.22)";
  roundRect(sx(0.4), sy(Z - 0.3), 6.5 * s, 3.2 * s, 8);
  ctx.fill();
  text("KHU BẾP MÁ TƯ", sx(3.6), sy(Z - 0.65), { size: 11, align: "center", bold: true, color: "rgba(30, 41, 59, 0.72)" });

  ctx.strokeStyle = "#78350f";
  ctx.lineWidth = 3.5;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Dây đèn lồng vàng-đỏ dọc mép trên nhà bè tạo ánh sáng ấm
  ctx.strokeStyle = "#451a03";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(Z)); ctx.lineTo(sx(X), sy(Z)); ctx.stroke();
  for (let x = 1.2; x < X; x += 2.2) {
    const lx = sx(x), ly = sy(Z) + 4;
    const pulse = 0.55 + 0.2 * Math.sin(tNow * 3.5 + x);
    const lGlow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 0.9 * s);
    lGlow.addColorStop(0, `rgba(254, 240, 138, ${pulse * 0.65})`);
    lGlow.addColorStop(1, "rgba(250, 204, 21, 0)");
    ctx.fillStyle = lGlow;
    ctx.beginPath(); ctx.arc(lx, ly, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = Math.floor(x) % 2 === 0 ? "#fde047" : "#fb923c";
    ctx.beginPath(); ctx.arc(lx, ly, 0.2 * s, 0, Math.PI * 2); ctx.fill();
  }

  const p = snap.player;
  const intR = meta.interact_radius || 1.5;
  const reservedOrders = (snap.customers || []).filter((c) => c.order_status === "reserved");

  // 3. Bếp nấu (Stoves — B1, B2)
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const dist = p ? Math.hypot(p.pos[0] - st.pos[0], p.pos[1] - st.pos[1]) : 999;
    const inRange = dist <= intR;
    const dishObj = st.dish;
    const dishTitle = dName(dishObj);
    const dishKey = dId(dishObj);
    const orderId = dishObj && typeof dishObj === "object" ? dishObj.order_id : "";

    // Bóng đổ 2.5D của bếp
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    roundRect(bx - 0.9 * s, by - 0.7 * s, 1.9 * s, 1.75 * s, 9);
    ctx.fill();

    const col = st.state === "cooking" ? "#ea580c" : st.state === "ready" ? "#16a34a" : "#475569";
    roundRect(bx - 0.95 * s, by - 0.85 * s, 1.9 * s, 1.7 * s, 9);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = inRange ? 3 : 1.8;
    ctx.strokeStyle = inRange ? "#fde047" : "#1e293b";
    ctx.stroke();

    // Mặt lò + hiệu ứng lửa đang nấu
    ctx.fillStyle = st.state === "cooking" ? "#fde047" : st.state === "ready" ? "#bbf7d0" : "#1e293b";
    ctx.beginPath(); ctx.arc(bx, by, 0.48 * s, 0, Math.PI * 2); ctx.fill();
    if (st.state === "cooking") {
      const fSize = 0.22 * s + Math.sin(tNow * 20) * 3;
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      ctx.beginPath(); ctx.arc(bx + Math.sin(tNow * 6) * 5, by - 0.7 * s - ((tNow * 20) % 16), fSize, 0, Math.PI * 2); ctx.fill();
    }
    text(st.id, bx, by + 5, { size: 13, align: "center", bold: true, color: st.state === "idle" ? "#e2e8f0" : "#0f172a" });

    if (st.state === "cooking") {
      const cookMax = ((DEFAULT_MENU[dishKey] && DEFAULT_MENU[dishKey].cook_s) || 6) * 60;
      const left = st.cook_ticks_left || 0;
      bar(bx - 1.15 * s, by + 0.95 * s, 2.3 * s, 14, 1 - left / cookMax, "#f97316", `Nấu ${(left / 60).toFixed(1)}s`, { fontSize: 11 });
      text(`🔥 ${dishTitle} (${orderId})`, bx, by - 1.05 * s, { size: 12, align: "center", bold: true, color: "#451a03" });
    } else if (st.state === "ready") {
      text(`✨ CHÍN: ${dishTitle} (${orderId})`, bx, by - 1.05 * s, { size: 12, align: "center", bold: true, color: "#14532d" });
      text(inRange && !snap.hand ? "👉 [E] BƯNG NGAY!" : "Chờ bưng [E]", bx, by + 1.2 * s, { size: 12, align: "center", bold: true, color: "#15803d" });
    } else {
      const canStart = reservedOrders.length > 0;
      text(canStart ? (inRange ? "👉 [E] NẤU ĐƠN CHỜ!" : "Sẵn sàng nấu [E]") : "Bếp rảnh", bx, by + 1.15 * s, {
        size: 11, align: "center", bold: canStart, color: canStart ? "#9a3412" : "#334155"
      });
    }
  });

  // 4. Bàn & Khách (Tables T1..T4 — Nếu bật Chế độ Sáng tạo: Khách là GÔ-KU SSJ3!)
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const tipMinRatio = meta.tip_min_patience_ratio || 0.5;
  const byTable = {};
  (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
  let gokuDrawnOnTable = false;

  (snap.tables || []).forEach((tb, idx) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const dist = p ? Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]) : 999;
    const inRange = dist <= intR;
    const c = byTable[tb.id];
    const handMatch = c && snap.hand && snap.hand.order_id === c.id && c.state === "waiting";

    // Bóng đổ 2.5D của bàn
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.ellipse(tx + 3, ty + 6, 0.96 * s, 0.85 * s, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#7c4a21";
    ctx.beginPath(); ctx.arc(tx, ty, 0.92 * s, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = (inRange && handMatch) ? 3.5 : 2;
    ctx.strokeStyle = (inRange && handMatch) ? "#4ade80" : "#451a03";
    ctx.stroke();
    text(tb.id, tx, ty + 5, { size: 13, align: "center", bold: true, color: "#fef3c7" });

    if (!c) {
      text("Trống", tx, ty + 1.25 * s, { size: 11, align: "center", color: "#57534e" });
    } else {
      const cx = tx, cy = ty - 1.38 * s;
      const patLeft = c.patience_ticks_left ?? patMax;
      const patRatio = patLeft / patMax;
      const isAngry = c.state === "waiting" && patRatio < 0.5;
      const isCritical = c.state === "waiting" && patRatio < 0.25;

      // Vẽ khách: GÔ-KU SSJ3 ở bàn đầu tiên, và Ca-Đíc SSJ / Pô-Cô-Lô / Gô-Han ở các bàn T2..T4 khi bật Sáng tạo!
      if (prefs.creative && !gokuDrawnOnTable) {
        gokuDrawnOnTable = true;
        drawGokuSSJ3(cx, cy, s, tNow, isAngry, c.state === "eating");
        if (isCritical && uiScreen === "playing") addShake(1.6);
      } else if (prefs.creative) {
        // Các chiến binh Z ghé quán nhà bè
        const zStyles = [
          { aura: "rgba(56,189,248,0.45)", hair: "#fde047", body: "#1d4ed8", tag: "Ca-Đíc" },
          { aura: "rgba(168,85,247,0.42)", hair: "#f8fafc", body: "#6b21a8", tag: "Pô-Cô-Lô" },
          { aura: "rgba(250,204,21,0.42)", hair: "#facc15", body: "#7c3aed", tag: "Gô-Han" }
        ];
        const zs = zStyles[(idx - 1 + zStyles.length) % zStyles.length];
        ctx.fillStyle = zs.aura;
        ctx.beginPath(); ctx.arc(cx, cy, 0.85 * s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = zs.body;
        ctx.beginPath(); ctx.arc(cx, cy, 0.56 * s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = zs.hair;
        ctx.beginPath();
        ctx.moveTo(cx - 0.45 * s, cy - 0.2 * s);
        ctx.lineTo(cx, cy - 0.9 * s);
        ctx.lineTo(cx + 0.45 * s, cy - 0.2 * s);
        ctx.closePath(); ctx.fill();
        text(c.id, cx, cy + 4, { size: 11, align: "center", bold: true, color: "#ffffff" });
      } else {
        ctx.fillStyle = c.state === "eating" ? "#22c55e" : (isCritical ? "#ef4444" : "#f43f5e");
        ctx.beginPath(); ctx.arc(cx, cy, 0.54 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
        text(c.id, cx, cy + 4, { size: 12, align: "center", bold: true, color: "#ffffff" });
      }

      // Thẻ đơn gọn đẹp, đặt lệch dưới bàn hoặc trên đầu tùy vị trí để 4 bàn KHÔNG chồng chéo!
      const cardW = Math.min(182, 3.6 * s), cardH = 54;
      const cardY = tb.pos[1] > 4 ? (cy - 0.72 * s - cardH) : (ty + 0.98 * s);
      panel(cx - cardW / 2, cardY, cardW, cardH, {
        bg: "rgba(11, 20, 34, 0.94)",
        border: handMatch ? "#4ade80" : (isCritical ? "#ef4444" : "rgba(246, 196, 83, 0.55)"),
        r: 8
      });
      const custTag = (prefs.creative && idx === 0) ? `⚡Gô-Ku (${c.id})` : c.id;
      text(`${custTag} · ${dName(c.dish_id)}`, cx, cardY + 15, { size: 11, align: "center", bold: true, color: "#fde047" });

      if (c.state === "waiting") {
        const hasTip = patRatio >= tipMinRatio;
        const patCol = hasTip ? "#22c55e" : (patRatio >= 0.25 ? "#f59e0b" : "#ef4444");
        bar(cx - cardW / 2 + 8, cardY + 21, cardW - 16, 14, patRatio, patCol,
          `${Math.ceil(patLeft / 60)}s ${hasTip ? "(+Boa)" : (isCritical ? "⚠ SẮP ĐI!" : "Mất Boa")}`,
          { marker: tipMinRatio, fontSize: 10 });
        let stLabel = "⏳ Chờ nấu [E ở bếp]";
        let stCol = "#fbbf24";
        if (handMatch) {
          stLabel = inRange ? "👉 NHẤN [E] PHỤC VỤ!" : "🍲 Mang món tới bàn!";
          stCol = "#4ade80";
        } else if (c.order_status === "assigned") {
          stLabel = "🔥 Đang làm ở bếp";
          stCol = "#38bdf8";
        }
        text(stLabel, cx, cardY + 48, { size: 11, align: "center", bold: true, color: stCol });
      } else if (c.state === "eating") {
        const eatLeft = c.eat_ticks_left ?? 0;
        const totalPay = (c.base_price || 0) + (c.tip || 0);
        bar(cx - cardW / 2 + 8, cardY + 21, cardW - 16, 14, 1 - eatLeft / eatMax, "#38bdf8",
          `Đang ăn: ${Math.ceil(eatLeft / 60)}s`, { fontSize: 10 });
        text(`Thu +${totalPay}k (Boa +${c.tip || 0}k)`, cx, cardY + 48, { size: 11, align: "center", bold: true, color: "#4ade80" });
      }
    }
  });

  // Nếu bật Sáng tạo mà chưa có khách ngồi bàn nào: Gô-Ku SSJ3 vẫn đứng gồng Ki chờ vào quán góc trên phải sàn bè!
  if (prefs.creative && !gokuDrawnOnTable) {
    const gx = sx(13.5), gy = sy(8.2);
    drawGokuSSJ3(gx, gy, s, tNow, false, false);
    text("⚡ GÔ-KU SSJ3 (Chờ gọi món · Bấm [Q/Space] Đấu Chưởng!)", gx, gy - 0.9 * s, {
      size: 11, align: "center", bold: true, color: "#fef08a", shadow: true
    });
  }

  // 5. Người chơi Út Sen trong quán
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (intR) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, intR * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(px, py + 0.45 * s, 0.5 * s, 0.22 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f97316";
    ctx.beginPath(); ctx.arc(px, py, 0.54 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.2; ctx.stroke();
    text("Út Sen", px, py + 0.9 * s, { size: 12, align: "center", bold: true, color: "#271206" });

    if (snap.hand) {
      const hName = dName(snap.hand);
      const hOrder = typeof snap.hand === "object" && snap.hand.order_id ? ` (${snap.hand.order_id})` : "";
      panel(px - 88, py - 0.65 * s - 30, 176, 26, { bg: "rgba(22, 163, 74, 0.95)", border: "#bbf7d0", r: 7 });
      text(`🍲 ${hName}${hOrder}`, px, py - 0.65 * s - 13, { size: 12, align: "center", bold: true, color: "#ffffff" });
    }
  }

  // 6. HUD PHÍA TRÊN (Chữ chính ≥ 18px ở 1280×720 đạt AC-P2-13!)
  panel(10, 8, w - 470, 58, { r: 12 });
  const timeLow = (snap.time_left_ticks || 0) <= 30 * 60;
  text(`🏮 NGÀY ${snap.day || 1} · QUÁN TỐI`, 22, 27, { size: 13, bold: true, color: "#f6c453" });
  text(`⏱ ${fmtTime(snap.time_left_ticks)}`, 22, 54, { size: 22, bold: true, color: timeLow ? "#ef4444" : "#f8fafc" });

  text(`💰 ${snap.money ?? 0}k`, 165, 34, { size: 20, bold: true, color: "#fde047" });
  text(`Tổng thu: ${snap.earned ?? 0}k`, 165, 55, { size: 13, color: "#cbd5e1" });

  const rep = snap.reputation ?? 3.0;
  text(`★ ${rep.toFixed(1)}/5.0`, 290, 34, { size: 20, bold: true, color: "#38bdf8" });
  text(`🏆 Điểm: ${snap.score ?? 0}`, 290, 55, { size: 15, bold: true, color: "#4ade80" });

  // Ô hiển thị Món trên tay
  const handW = Math.max(180, w - 470 - 445);
  if (handW > 140) {
    panel(430, 14, handW, 46, {
      bg: snap.hand ? "rgba(20, 83, 45, 0.80)" : "rgba(30, 41, 59, 0.65)",
      border: snap.hand ? "#4ade80" : "rgba(148, 163, 184, 0.28)",
      r: 9
    });
    text("TRÊN TAY ÚT SEN:", 442, 30, { size: 11, bold: true, color: "#94a3b8" });
    if (snap.hand) {
      text(`🍲 ${dName(snap.hand)} (${snap.hand.order_id || ""})`, 442, 51, { size: 15, bold: true, color: "#4ade80" });
    } else {
      text("(Tay trống — Bấm [E] ở bếp)", 442, 51, { size: 14, color: "#cbd5e1" });
    }
  }

  // 7. Thanh Kho nguyên liệu khả dụng phía dưới (đủ 6 loại nguyên liệu Contract v1.1!)
  const { stock, reserved, avail } = computeAvailableStock();
  panel(10, h - 62, w - 20, 54, { r: 10 });
  text("📦 KHO KHẢ DỤNG:", 20, h - 38, { size: 14, bold: true, color: "#f6c453" });
  const kinds = ["ca_loc", "ca_linh", "ca_keo", "bong_dien_dien", "bong_sung", "keo_neo"];
  const colW = Math.min(185, (w - 190) / 6);
  kinds.forEach((k, i) => {
    const kx = 175 + i * colW;
    const tot = stock[k] || 0, res = reserved[k] || 0, av = avail[k] || 0;
    ctx.fillStyle = kc(k);
    ctx.beginPath(); ctx.arc(kx, h - 42, 5.5, 0, Math.PI * 2); ctx.fill();
    text(`${KIND_SHORT[k]}: ${av}`, kx + 10, h - 37, { size: 15, bold: true, color: av > 0 ? "#f8fafc" : "#64748b" });
    text(res > 0 ? `(Tồn ${tot}, Giữ ${res})` : `(Tồn ${tot})`, kx + 10, h - 19, { size: 11, color: res > 0 ? "#fde047" : "#94a3b8" });
  });

  drawRecipeCard(w, h);
}

// ---------- Vòng lặp Render 60 FPS ----------
let lastFrameTs = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTs) / 1000));
  lastFrameTs = now;

  // Đếm ngược tự động chuyển Intro / DayResult (không tiêu tick backend)
  if ((uiScreen === "intro" || uiScreen === "evening_intro" || uiScreen === "day_result") && introTimer > 0) {
    introTimer -= dt;
    if (introTimer <= 0) {
      uiScreen = activePhase() === "shop" ? "shop" : "playing";
      renderModal();
    }
  }

  const [w, h] = fit();
  ctx.fillStyle = "#070d17";
  ctx.fillRect(0, 0, w, h);

  if (snap) {
    ctx.save();
    if (vfx.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * vfx.shake, (Math.random() - 0.5) * vfx.shake);
    }
    const ph = activePhase();
    if (ph === "quan" || ph === "shop") drawQuan(w, h);
    else drawGather(w, h, dt);

    updateAndDrawVfx(dt);
    ctx.restore();

    if (uiScreen === "playing") eventLog(w, h);
    if (offline) {
      panel(w / 2 - 220, 74, 440, 40, { bg: "rgba(127, 29, 29, 0.94)", border: "#ef4444" });
      text("⚠ Mất kết nối tới máy chủ chonoi.live!", w / 2, 100, { align: "center", size: 16, bold: true, color: "#fecaca" });
    }
    if (snap.error) {
      panel(w / 2 - 240, 74, 480, 40, { bg: "rgba(127, 29, 29, 0.94)", border: "#ef4444" });
      text("⚠ Lỗi mô phỏng — xem terminal. Nhấn [R] để chơi lại.", w / 2, 100, { align: "center", size: 16, bold: true, color: "#fecaca" });
    }
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải Quán Ăn Chợ Nổi…", w / 2, h / 2, { align: "center", size: 20, bold: true });
  }
}

renderModal();
requestAnimationFrame(frame);
</script>
