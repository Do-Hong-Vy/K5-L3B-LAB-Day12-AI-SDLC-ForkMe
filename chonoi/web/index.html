<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quán Ăn Chợ Nổi — Nhóm ForkMe</title>
  <style>
    :root {
      --bg-dark: #0b131e;
      --panel-bg: rgba(13, 23, 36, 0.86);
      --panel-border: rgba(255, 214, 138, 0.28);
      --gold: #f6c453;
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #22c55e;
      --cyan: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text);
      font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    "use strict";
    /*
     * Client chơi trực tiếp v1.0 — Nhóm ForkMe (Phog2811).
     * Hợp đồng: CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input, POST /restart.
     * Tự động tắt hoàn toàn khi chạy chonoi.headless (không ảnh hưởng byte JSONL).
     * Phím: WASD / Mũi tên = di chuyển · E = tương tác · Space = bắt cá · R = chơi lại · H = ẩn/hiện sổ tay thực đơn.
     */
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    let snap = null, offline = false, showHelp = true;
    let bubbles = [];
    for (let i = 0; i < 28; i++) {
      bubbles.push({ x: Math.random() * 100, d: 2 + Math.random() * 27, r: 1.5 + Math.random() * 2.5, spd: 0.015 + Math.random() * 0.03, phase: Math.random() * 6.28 });
    }

    // ---------- Từ điển dữ liệu hiển thị (đọc ưu tiên từ meta, fallback chuẩn PRD-0) ----------
    const KIND_COLOR = {
      ca_loc: "#84a955",
      ca_linh: "#bae6fd",
      ca_keo: "#d9a066",
      bong_dien_dien: "#facc15",
      bong_sung: "#f472b6",
      keo_neo: "#8fcf6b"
    };
    const KIND_NAME = {
      ca_loc: "Cá lóc",
      ca_linh: "Cá linh",
      ca_keo: "Cá kèo",
      bong_dien_dien: "Bông điên điển",
      bong_sung: "Bông súng",
      keo_neo: "Kèo nèo"
    };
    const DISH_NAME = {
      ca_loc_nuong_trui: "Cá lóc nướng trui",
      goi_bong_sung: "Gỏi bông súng",
      lau_ca_linh_dien_dien: "Lẩu cá linh điên điển"
    };
    const DEFAULT_MENU = {
      ca_loc_nuong_trui: { recipe: { ca_loc: 1 }, cook_s: 6, price: 60 },
      goi_bong_sung: { recipe: { bong_sung: 2 }, cook_s: 4, price: 40 },
      lau_ca_linh_dien_dien: { recipe: { ca_linh: 3, bong_dien_dien: 1 }, cook_s: 10, price: 120 }
    };
    const REASON_TEXT = {
      docked: "Đã cập bến bàn giao kho an toàn",
      time: "Hết thời gian ca làm việc",
      fainted: "Ngất do ngạt nước (Mất toàn bộ giỏ!)",
      tick_limit: "Chạm giới hạn tick",
      error: "Lỗi thực thi mô phỏng"
    };

    const kc = (k) => KIND_COLOR[k] || "#cbd5e1";
    const kName = (k) => KIND_NAME[k] || k;
    const dName = (d) => {
      if (!d) return "";
      const id = typeof d === "string" ? d : (d.dish_id || "");
      return DISH_NAME[id] || id || "Món ăn";
    };
    const dId = (d) => (!d ? "" : (typeof d === "string" ? d : (d.dish_id || "")));

    // ---------- Vào: Bàn phím & Chuột ----------
    const down = new Set();
    const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
    let queue = [], inflight = false, lastSent = "";

    function currentInput() {
      const mode = snap ? snap.mode : "gather";
      const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
      let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0); // gather: xuống = d dương
      if (mode === "quan") dy = -dy;                              // quan: lên (bắc) = z dương
      return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
    }
    function pushInput() {
      const s = JSON.stringify(currentInput());
      if (s === lastSent) return;
      lastSent = s;
      queue.push(s);
      flush();
    }
    async function flush() {
      if (inflight) return;
      inflight = true;
      while (queue.length) {
        const body = queue.shift();
        try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
        catch (e) { /* mất kết nối: poll sẽ báo */ }
      }
      inflight = false;
    }
    function triggerRestart() {
      fetch("/restart", { method: "POST" });
      lastSent = "";
      down.clear();
    }
    function keyName(e) { return e.key.toLowerCase(); }

    addEventListener("keydown", (e) => {
      const k = keyName(e);
      if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
      if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === "e") down.add("interact");
      else if (k === " ") { down.add("catch"); e.preventDefault(); }
      else if (k === "r") { triggerRestart(); }
      else if (k === "h") { showHelp = !showHelp; }
      pushInput();
    });
    addEventListener("keyup", (e) => {
      const k = keyName(e);
      if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
      else if (k === "e") down.delete("interact");
      else if (k === " ") down.delete("catch");
      pushInput();
    });
    addEventListener("blur", () => { down.clear(); pushInput(); });
    cv.addEventListener("click", (e) => {
      if (snap && snap.finished) {
        triggerRestart();
      }
    });

    // ---------- Ra: Poll snapshot ----------
    async function poll() {
      try {
        const r = await fetch("/state", { cache: "no-store" });
        snap = await r.json();
        offline = false;
      } catch (e) { offline = true; }
      setTimeout(poll, 16);
    }
    poll();

    // ---------- Tiện ích vẽ UI ----------
    function fit() {
      const dpr = window.devicePixelRatio || 1;
      const w = innerWidth, h = innerHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [w, h];
    }
    function text(s, x, y, o = {}) {
      const weight = o.bold ? "700 " : (o.semi ? "600 " : "");
      ctx.font = weight + (o.size || 14) + "px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = o.color || "#f1f5f9";
      ctx.textAlign = o.align || "left";
      ctx.textBaseline = o.base || "alphabetic";
      if (o.shadow) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.65)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 1;
        ctx.fillText(s, x, y);
        ctx.restore();
      } else {
        ctx.fillText(s, x, y);
      }
    }
    function roundRect(x, y, w, h, r = 8) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }
    function panel(x, y, w, h, o = {}) {
      roundRect(x, y, w, h, o.r || 10);
      ctx.fillStyle = o.bg || "rgba(12, 22, 35, 0.84)";
      ctx.fill();
      ctx.lineWidth = o.lw || 1.2;
      ctx.strokeStyle = o.border || "rgba(255, 214, 138, 0.25)";
      ctx.stroke();
    }
    function bar(x, y, w, h, frac, color, label, o = {}) {
      const clamped = Math.max(0, Math.min(1, frac || 0));
      roundRect(x, y, w, h, o.r || 6);
      ctx.fillStyle = o.bg || "rgba(0, 0, 0, 0.55)";
      ctx.fill();
      if (clamped > 0) {
        roundRect(x, y, Math.max(4, w * clamped), h, o.r || 6);
        ctx.fillStyle = color;
        ctx.fill();
      }
      if (o.marker !== undefined) {
        const mx = x + w * o.marker;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(mx, y - 1);
        ctx.lineTo(mx, y + h + 1);
        ctx.stroke();
      }
      roundRect(x + 0.5, y + 0.5, w - 1, h - 1, o.r || 6);
      ctx.strokeStyle = o.border || "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (label) {
        text(label, x + w / 2, y + h / 2 + 4, { size: o.fontSize || 11, align: "center", bold: true, color: "#ffffff", shadow: true });
      }
    }
    function fmtTime(ticks) {
      const s = Math.max(0, Math.ceil((ticks || 0) / 60));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function countItems(arr) {
      const out = {};
      (arr || []).forEach((k) => { out[k] = (out[k] || 0) + 1; });
      return out;
    }
    function computeAvailableStock() {
      if (!snap) return { stock: {}, reserved: {}, avail: {} };
      if (snap.mode === "gather") {
        const c = countItems(snap.hold || []);
        return { stock: c, reserved: {}, avail: c };
      }
      const stock = Object.assign({}, snap.stock || {});
      const reserved = {};
      (snap.customers || []).forEach((c) => {
        const r = c.reserved || {};
        Object.keys(r).forEach((k) => { reserved[k] = (reserved[k] || 0) + r[k]; });
      });
      const avail = {};
      const allKeys = new Set([...Object.keys(stock), ...Object.keys(reserved)]);
      allKeys.forEach((k) => {
        avail[k] = Math.max(0, (stock[k] || 0) - (reserved[k] || 0));
      });
      return { stock, reserved, avail };
    }
    function canCookCount(recipe, avail) {
      let maxPortions = Infinity;
      for (const [k, req] of Object.entries(recipe)) {
        const have = avail[k] || 0;
        maxPortions = Math.min(maxPortions, Math.floor(have / req));
      }
      return maxPortions === Infinity ? 0 : maxPortions;
    }

    // ---------- Định dạng Log sự kiện tiếng Việt dễ đọc ----------
    function formatEventVN(e) {
      const d = e.data || {};
      switch (e.name) {
        case "dive": return { msg: `Lặn xuống nước (d=${d.pos ? d.pos[1].toFixed(1) : "?"}m)`, col: "#38bdf8" };
        case "surface": return { msg: `Nổi lên mặt nước — Đang hồi oxy`, col: "#4ade80" };
        case "oxygen_empty": return { msg: `HẾT OXY! Mau nổi lên trước khi ngạt!`, col: "#fb7185" };
        case "choke": return { msg: `Ngạt nước! -1 Máu (còn ${d.hp} ♥)`, col: "#ef4444" };
        case "faint": return { msg: `Ngất xỉu dưới sông! Mất toàn bộ giỏ (${(d.lost || []).length} món)`, col: "#ef4444" };
        case "gather": return { msg: `Hái ${d.node_id}: +${d.amount} ${kName(d.kind)}`, col: "#facc15" };
        case "node_regrown": return { msg: `Nút ${d.node_id} đã mọc lại!`, col: "#86efac" };
        case "fish_caught": return { msg: `Bắt đàn ${d.fish_id}: +${d.yield} ${kName(d.kind)}`, col: "#38bdf8" };
        case "hold_full": return { msg: `Giỏ không đủ chỗ! (Cần ${d.required} ô, trống ${d.free} ô)`, col: "#fb923c" };
        case "gather_end": return { msg: `Kết thúc buổi sáng (${REASON_TEXT[d.reason] || d.reason})`, col: "#f6c453" };
        case "customer_arrived": return { msg: `Khách ${d.order_id} vào bàn ${d.table_id} gọi ${dName(d.dish_id)}`, col: "#fde047" };
        case "no_dish": return { msg: `Khách ghé nhưng kho thiếu nguyên liệu nấu món!`, col: "#fb923c" };
        case "cook_started": return { msg: `Bếp ${d.stove_id} nấu ${dName(d.dish_id)} cho ${d.order_id} (${d.base_price}k)`, col: "#f59e0b" };
        case "dish_ready": return { msg: `Bếp ${d.stove_id}: ${dName(d.dish_id)} ĐÃ CHÍN! Nhấn [E] bưng`, col: "#4ade80" };
        case "dish_picked": return { msg: `Bưng ${dName(d.dish_id)} (đơn ${d.order_id}) lên tay`, col: "#38bdf8" };
        case "served": return { msg: `Phục vụ bàn ${d.table_id}: ${dName(d.dish_id)} (Boa +${d.tip}k)`, col: "#4ade80" };
        case "paid": return { msg: `Thu tiền bàn ${d.table_id}: +${d.amount}k (Giá ${d.base_price}k + Boa ${d.tip}k)`, col: "#facc15" };
        case "customer_left": return { msg: `Khách ${d.order_id} (bàn ${d.table_id}) rời đi (${d.reason === "patience" ? "Hết kiên nhẫn -0.5★" : "Đóng ca"})`, col: d.reason === "patience" ? "#ef4444" : "#94a3b8" };
        case "quan_end": return { msg: `Đóng ca tối! Thu ${d.shift_earned}k · Uy tín ${Number(d.reputation).toFixed(1)}★`, col: "#f6c453" };
        default: return { msg: `${e.name} ${JSON.stringify(d)}`, col: "#cbd5e1" };
      }
    }

    // ---------- Bảng Thực đơn & Công thức (CP1-U2) ----------
    function drawRecipeCard(w, h) {
      if (!showHelp) {
        panel(w - 190, 66, 176, 30, { r: 8 });
        text("📖 [H] Mở Sổ tay Thực đơn", w - 102, 85, { size: 12, align: "center", color: "#f6c453", bold: true });
        return;
      }
      const { avail } = computeAvailableStock();
      const cw = 278, ch = 148, cx = w - cw - 14, cy = 68;
      panel(cx, cy, cw, ch, { bg: "rgba(11, 20, 32, 0.88)", border: "rgba(246, 196, 83, 0.35)" });
      text("📖 SỔ TAY THỰC ĐƠN MÁ TƯ", cx + 12, cy + 20, { size: 12, bold: true, color: "#f6c453" });
      text("[H] Thu gọn", cx + cw - 12, cy + 20, { size: 11, align: "right", color: "#94a3b8" });

      const entries = Object.entries(DEFAULT_MENU);
      entries.forEach(([id, info], idx) => {
        const ry = cy + 36 + idx * 36;
        const portions = canCookCount(info.recipe, avail);
        roundRect(cx + 8, ry - 4, cw - 16, 31, 6);
        ctx.fillStyle = portions > 0 ? "rgba(34, 197, 94, 0.14)" : "rgba(255, 255, 255, 0.04)";
        ctx.fill();
        text(dName(id), cx + 14, ry + 10, { size: 12, bold: true, color: portions > 0 ? "#f8fafc" : "#cbd5e1" });
        text(`${info.price}k · ${info.cook_s}s`, cx + cw - 14, ry + 10, { size: 11, align: "right", bold: true, color: "#facc15" });
        const ingStr = Object.entries(info.recipe).map(([k, n]) => `${kName(k)}×${n}`).join(" + ");
        text(ingStr, cx + 14, ry + 23, { size: 11, color: "#94a3b8" });
        const badgeText = portions > 0 ? `Đủ nấu ×${portions}` : "Thiếu NL";
        text(badgeText, cx + cw - 14, ry + 23, { size: 11, align: "right", bold: true, color: portions > 0 ? "#4ade80" : "#64748b" });
      });
    }

    // ---------- Nhật ký sự kiện (Event Log) ----------
    function eventLog(w, h) {
      const ev = (snap.events || []).slice(-6);
      if (!ev.length) return;
      const lw = 340, lh = ev.length * 19 + 28;
      const lx = w - lw - 14, ly = h - lh - 38;
      panel(lx, ly, lw, lh, { bg: "rgba(10, 18, 28, 0.78)", border: "rgba(148, 163, 184, 0.22)", r: 8 });
      text("NHẬT KÝ SỰ KIỆN (GẦN NHẤT)", lx + 10, ly + 17, { size: 10, bold: true, color: "#94a3b8" });
      ev.forEach((e, i) => {
        const info = formatEventVN(e);
        const y = ly + 33 + i * 18;
        text(`t${e.tick}`, lx + 10, y, { size: 10, color: "#64748b", bold: true });
        const clipped = info.msg.length > 46 ? info.msg.slice(0, 44) + "…" : info.msg;
        text(clipped, lx + 46, y, { size: 11, color: info.col });
      });
    }

    // ---------- Màn hình tổng kết cuối ca / Cảnh báo (CP1-U2) ----------
    function overlay(w, h) {
      if (offline) {
        panel(w / 2 - 210, 66, 420, 38, { bg: "rgba(127, 29, 29, 0.92)", border: "#ef4444" });
        text("⚠ Mất kết nối tới máy chủ (chonoi.live đã dừng?)", w / 2, 90, { align: "center", color: "#fecaca", size: 14, bold: true });
      }
      if (snap.error) {
        panel(w / 2 - 230, 66, 460, 42, { bg: "rgba(127, 29, 29, 0.94)", border: "#ef4444" });
        text("⚠ Luật của nhóm báo lỗi — xem terminal. Nhấn R để chơi lại.", w / 2, 92, { align: "center", color: "#fecaca", size: 14, bold: true });
      }
      if (snap.finished) {
        ctx.fillStyle = "rgba(5, 10, 18, 0.72)";
        ctx.fillRect(0, 0, w, h);
        const mw = 460, mh = 250, mx = w / 2 - mw / 2, my = h / 2 - mh / 2;
        panel(mx, my, mw, mh, { bg: "rgba(15, 25, 40, 0.96)", border: "#f6c453", lw: 2, r: 14 });

        const isGather = snap.mode === "gather";
        const title = isGather ? "KẾT THÚC BUỔI SÁNG (LẶN & HÁI)" : "KẾT THÚC CA TỐI (NHÀ BÈ MÁ TƯ)";
        const reason = REASON_TEXT[snap.reason] || snap.reason || "Hoàn thành";
        const isBad = snap.reason === "fainted";

        text(title, w / 2, my + 38, { align: "center", size: 18, bold: true, color: "#f6c453" });
        text(reason, w / 2, my + 66, { align: "center", size: 15, bold: true, color: isBad ? "#f87171" : "#4ade80" });

        // Thống kê chi tiết
        roundRect(mx + 24, my + 84, mw - 48, 102, 10);
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.fill();

        if (isGather) {
          const counts = countItems(snap.hold || []);
          const itemsStr = Object.keys(counts).length
            ? Object.entries(counts).map(([k, n]) => `${kName(k)} ×${n}`).join(" · ")
            : "Kho rỗng (0 nguyên liệu)";
          text(`Giỏ bàn giao vào kho (${(snap.hold || []).length}/${snap.hold_capacity || 12}):`, w / 2, my + 112, { align: "center", size: 13, color: "#cbd5e1" });
          text(itemsStr, w / 2, my + 138, { align: "center", size: 14, bold: true, color: "#facc15" });
          const { avail } = computeAvailableStock();
          const cookable = Object.entries(DEFAULT_MENU)
            .map(([id, m]) => ({ name: dName(id), n: canCookCount(m.recipe, avail) }))
            .filter((x) => x.n > 0);
          const cookStr = cookable.length ? "Đủ nấu: " + cookable.map((x) => `${x.name} (×${x.n})`).join(", ") : "Chưa đủ nguyên liệu ghép món hoàn chỉnh";
          text(cookStr, w / 2, my + 166, { align: "center", size: 12, color: cookable.length ? "#86efac" : "#94a3b8" });
        } else {
          text(`Doanh thu: ${snap.earned ?? 0}k   |   Số dư: ${snap.money ?? 0}k`, w / 2, my + 114, { align: "center", size: 14, bold: true, color: "#facc15" });
          text(`Uy tín quán: ${(snap.reputation ?? 0).toFixed(1)} / 5.0 ★`, w / 2, my + 142, { align: "center", size: 14, bold: true, color: "#38bdf8" });
          text(`TỔNG ĐIỂM (SCORE): ${snap.score ?? 0}`, w / 2, my + 170, { align: "center", size: 16, bold: true, color: "#4ade80" });
        }

        // Nút Chơi lại
        roundRect(w / 2 - 135, my + 200, 270, 36, 8);
        ctx.fillStyle = "#f59e0b";
        ctx.fill();
        text("↻ Nhấn [R] hoặc Click để Chơi lại", w / 2, my + 223, { align: "center", size: 14, bold: true, color: "#0f172a" });
      }
    }

    // ============================================================================
    // CẢNH 1: BUỔI SÁNG — LẶN & HÁI (GATHER: nhìn ngang, x sang phải, d xuống)
    // ============================================================================
    function drawGather(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const X = b.x[1], D = b.d[1], SKY = 6.5;
      const top = 60, bottom = 72;
      const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
      const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
      const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
      const surfD = meta.surface_depth !== undefined ? meta.surface_depth : 0.5;
      const tNow = performance.now() * 0.001;

      // 1. Bầu trời hừng đông miền Tây
      const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
      skyGrad.addColorStop(0, "#fed7aa");
      skyGrad.addColorStop(0.55, "#fde68a");
      skyGrad.addColorStop(1, "#bae6fd");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, top, w, oy - top);

      // Mặt trời buổi sớm & rặng dừa nước xa xa
      ctx.fillStyle = "rgba(251, 146, 60, 0.35)";
      ctx.beginPath(); ctx.arc(sx(82), oy - 3.2 * s, 2.4 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(21, 128, 61, 0.28)";
      for (let x = 8; x < X; x += 9) {
        ctx.beginPath();
        ctx.arc(sx(x), oy, 2.6 * s, Math.PI, 0);
        ctx.fill();
      }

      // 2. Lòng sông Chín Khúc màu phù sa & tia nắng xuyên nước
      const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
      waterGrad.addColorStop(0, "#2998c6");
      waterGrad.addColorStop(0.35, "#155e75");
      waterGrad.addColorStop(1, "#07192e");
      ctx.fillStyle = waterGrad;
      ctx.fillRect(sx(0), oy, X * s, D * s);

      // Tia nắng (God rays)
      ctx.save();
      ctx.beginPath(); ctx.rect(sx(0), oy, X * s, D * s); ctx.clip();
      for (let i = 0; i < 5; i++) {
        const rx = sx(15 + i * 20 + Math.sin(tNow * 0.4 + i) * 2);
        const rayG = ctx.createLinearGradient(rx, oy, rx + 5 * s, sy(D * 0.75));
        rayG.addColorStop(0, "rgba(254, 240, 138, 0.14)");
        rayG.addColorStop(1, "rgba(254, 240, 138, 0)");
        ctx.fillStyle = rayG;
        ctx.beginPath();
        ctx.moveTo(rx - 2 * s, oy);
        ctx.lineTo(rx + 2.5 * s, oy);
        ctx.lineTo(rx + 9 * s, sy(D * 0.75));
        ctx.lineTo(rx + 1 * s, sy(D * 0.75));
        ctx.closePath();
        ctx.fill();
      }
      // Bong bóng nước trang trí
      ctx.fillStyle = "rgba(224, 242, 254, 0.25)";
      bubbles.forEach((bb) => {
        bb.d -= bb.spd;
        if (bb.d < 0.4) bb.d = D - 0.5;
        const bx = sx(bb.x + Math.sin(tNow * 2 + bb.phase) * 0.4);
        const by = sy(bb.d);
        ctx.beginPath(); ctx.arc(bx, by, bb.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();

      // Biên mặt nước (d = 0) & ngưỡng hồi oxy (surface_depth = 0.5m)
      ctx.strokeStyle = "#e0f2fe";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

      ctx.strokeStyle = "rgba(125, 211, 252, 0.35)";
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx(0), sy(surfD)); ctx.lineTo(sx(X), sy(surfD)); ctx.stroke();
      ctx.setLineDash([]);
      text(`Mặt nước hồi Oxy (d ≤ ${surfD}m)`, sx(X) - 6, sy(surfD) + 11, { size: 10, align: "right", color: "rgba(186, 230, 253, 0.65)" });

      // Lưới độ sâu
      for (let d = 5; d <= D; d += 5) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
        text(d + "m", sx(0) + 5, sy(d) - 3, { size: 10, color: "rgba(255, 255, 255, 0.45)" });
      }

      const p = snap.player;
      const px = p ? sx(p.pos[0]) : 0, py = p ? sy(p.pos[1]) : 0;
      const underwater = p ? (p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface) : false;

      // 3. Nhà sàn Bến thuyền & Xuồng ba lá (Dock)
      const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
      const inDock = p ? Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr : false;
      // Cọc nhà sàn
      ctx.fillStyle = "#5c3a21";
      ctx.fillRect(sx(dp[0] - 1.6), sy(-0.8), 0.35 * s, 2.2 * s);
      ctx.fillRect(sx(dp[0] + 1.25), sy(-0.8), 0.35 * s, 2.2 * s);
      // Sàn gỗ & mái lá
      ctx.fillStyle = "#8d6e4b";
      ctx.fillRect(sx(dp[0] - 2.0), sy(-0.9), 4.0 * s, 0.85 * s);
      ctx.fillStyle = "#b45309";
      ctx.beginPath();
      ctx.moveTo(sx(dp[0] - 2.3), sy(-0.9));
      ctx.lineTo(sx(dp[0]), sy(-2.9));
      ctx.lineTo(sx(dp[0] + 2.3), sy(-0.9));
      ctx.closePath();
      ctx.fill();
      // Vòng bán kính cập bến
      ctx.strokeStyle = inDock ? "#4ade80" : "rgba(253, 224, 71, 0.75)";
      ctx.lineWidth = inDock ? 2.5 : 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      text(inDock ? "⚓ Nhấn [E] Cập bến!" : "⚓ Bến (E)", sx(dp[0]), sy(-3.2), {
        size: 11, align: "center", bold: true, color: inDock ? "#15803d" : "#78350f"
      });

      // 4. Các nút hái trên mặt nước (Bông điên điển / Bông súng)
      const intR = meta.interact_radius || 2.0;
      (snap.nodes || []).forEach((n) => {
        const ready = n.ready !== false;
        const dist = p ? Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) : 999;
        const inRange = !underwater && ready && dist <= intR;
        const nx = sx(n.pos[0]), ny = sy(n.pos[1]);

        ctx.save();
        ctx.globalAlpha = ready ? 1 : 0.38;
        // Lá nổi trên mặt nước
        ctx.fillStyle = "#15803d";
        ctx.beginPath(); ctx.ellipse(nx, ny + 0.1 * s, 1.15 * s, 0.35 * s, 0, 0, Math.PI * 2); ctx.fill();
        // Hoa
        ctx.fillStyle = kc(n.kind);
        ctx.beginPath(); ctx.ellipse(nx, ny - 0.25 * s, 0.85 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
        if (inRange) {
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(nx, ny - 0.1 * s, 1.3 * s, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();

        text(`${n.id} · ${kName(n.kind)}`, nx, ny - 1.0 * s, {
          size: 10, align: "center", bold: true, color: inRange ? "#14532d" : "#1e293b"
        });
        if (!ready && n.regrow_ticks) {
          const regrowMax = (meta.regrow_s || 20) * 60;
          bar(nx - 14, ny + 0.45 * s, 28, 6, 1 - n.regrow_ticks / regrowMax, "#4ade80", "");
          text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 0.45 * s + 15, { size: 10, align: "center", color: "#e2e8f0", bold: true });
        } else if (inRange) {
          text("[E] Hái +1", nx, ny + 1.1 * s, { size: 10, align: "center", bold: true, color: "#fef08a", shadow: true });
        }
      });

      // 5. Đàn cá dưới sông (Cá linh ×3 / Cá lóc ×1)
      const catchR = meta.catch_radius || 2.0;
      const yieldMap = meta.fish_yield || { ca_linh: 3, ca_loc: 1 };
      (snap.fish || []).forEach((f) => {
        const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
        const dist = p ? Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]) : 999;
        const inRange = underwater && dist <= catchR;
        const yld = yieldMap[f.kind] || 1;
        const wobble = Math.sin(tNow * 4 + fx * 0.05) * 0.08;

        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180 + wobble);
        if (inRange) {
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 1.35 * s, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = kc(f.kind);
        // Vẽ thân cá + đuôi cá
        ctx.beginPath(); ctx.ellipse(0, 0, 0.95 * s, 0.48 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.45 * s, -0.45 * s); ctx.lineTo(-1.45 * s, 0.45 * s); ctx.closePath(); ctx.fill();
        // Mắt cá
        ctx.fillStyle = "#0f172a";
        ctx.beginPath(); ctx.arc(0.5 * s, -0.12 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        text(`${f.id} ${kName(f.kind)} (+${yld})`, fx, fy - 0.85 * s, {
          size: 10, align: "center", bold: inRange, color: inRange ? "#fde047" : "rgba(241, 245, 249, 0.85)", shadow: true
        });
        if (inRange && p && (p.catch_cd_ticks || 0) === 0) {
          text("[Space] Bắt!", fx, fy + 1.2 * s, { size: 10, align: "center", bold: true, color: "#38bdf8", shadow: true });
        }
      });

      // 6. Nhân vật Út Sen (áo bà ba cam, khăn rằn, kính lặn)
      if (p) {
        if (catchR && underwater) {
          ctx.strokeStyle = (p.catch_cd_ticks || 0) === 0 ? "rgba(56, 189, 248, 0.45)" : "rgba(148, 163, 184, 0.22)";
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(px, py, catchR * s, 0, Math.PI * 2); ctx.stroke();
        }
        if (intR && !underwater) {
          ctx.strokeStyle = "rgba(250, 204, 21, 0.45)";
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(px, py, intR * s, 0, Math.PI * 2); ctx.stroke();
        }
        if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
          const a = ((p.heading_deg || 0) * Math.PI) / 180;
          ctx.save();
          ctx.translate(px, py);
          // Hào quang cảnh báo khi ngạt nước
          if ((p.zero_oxy_ticks || 0) > 0) {
            ctx.fillStyle = `rgba(239, 68, 68, ${0.25 + 0.2 * Math.sin(tNow * 12)})`;
            ctx.beginPath(); ctx.arc(0, 0, 1.15 * s, 0, Math.PI * 2); ctx.fill();
          }
          // Thân áo bà ba
          ctx.fillStyle = "#f97316";
          ctx.beginPath(); ctx.arc(0, 0, 0.65 * s, 0, Math.PI * 2); ctx.fill();
          // Khăn rằn & kính lặn theo hướng bơi
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 0.95 * s, Math.sin(a) * 0.95 * s); ctx.stroke();
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath(); ctx.arc(Math.cos(a) * 0.35 * s, Math.sin(a) * 0.35 * s, 0.25 * s, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          text("Út Sen", px, py - 0.95 * s, { size: 10, align: "center", bold: true, color: "#ffffff", shadow: true });
        }
      }

      // 7. Thanh HUD phía trên (Buổi sáng)
      panel(10, 8, w - 20, 48, { r: 10 });
      const timeLow = (snap.time_left_ticks || 0) < 30 * 60;
      text("☀ BUỔI SÁNG: SÔNG CHÍN KHÚC", 22, 26, { size: 12, bold: true, color: "#f6c453" });
      text(`⏱ ${fmtTime(snap.time_left_ticks)}`, 22, 46, { size: 16, bold: true, color: timeLow ? "#ef4444" : "#f8fafc" });

      if (p) {
        // Thanh Oxy
        const oxy = p.oxygen_ticks ?? 0, oxyMax = p.oxygen_max_ticks || 1800;
        const oxyRatio = oxy / oxyMax;
        const oxyCol = oxy === 0 ? "#ef4444" : (oxyRatio < 0.25 ? "#f97316" : "#38bdf8");
        bar(220, 14, 210, 16, oxyRatio, oxyCol, `OXY: ${Math.ceil(oxy / 60)}s / ${Math.round(oxyMax / 60)}s`);

        // Thanh cảnh báo ngạt (zero_oxy_ticks) hoặc trạng thái mặt nước
        const chokeMax = meta.choke_interval_ticks || 60;
        const zTicks = p.zero_oxy_ticks || 0;
        if (zTicks > 0 || (underwater && oxy === 0)) {
          bar(220, 34, 210, 14, zTicks / chokeMax, "#ef4444", `⚠ ĐANG NGẠT: ${zTicks}/${chokeMax} tick (-1♥)`, { fontSize: 10 });
        } else {
          const zoneStr = underwater ? `Đang lặn (d=${p.pos[1].toFixed(1)}m)` : `Trên mặt nước — Hồi Oxy`;
          text(zoneStr, 224, 46, { size: 11, bold: true, color: underwater ? "#7dd3fc" : "#4ade80" });
        }

        // Máu (HP)
        const hp = p.hp ?? 3, hpMax = p.hp_max || 3;
        text("MÁU:", 448, 27, { size: 11, bold: true, color: "#cbd5e1" });
        let hearts = "";
        for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥ " : "♡ ";
        text(hearts.trim(), 484, 29, { size: 18, bold: true, color: hp <= 1 ? "#ef4444" : "#fb7185" });
        text(`Tọa độ: x=${p.pos[0].toFixed(1)}m, d=${p.pos[1].toFixed(1)}m`, 448, 46, { size: 11, color: "#94a3b8" });

        // Hồi chiêu bắt cá (catch_cd_ticks)
        const cd = p.catch_cd_ticks || 0;
        const cdMax = Math.max(1, Math.round((meta.catch_cooldown_s || 0.5) * 60));
        bar(625, 16, 155, 22, cd > 0 ? 1 - cd / cdMax : 1, cd > 0 ? "#64748b" : "#22c55e",
          cd > 0 ? `Hồi vợt bắt: ${(cd / 60).toFixed(1)}s` : `Vợt cá [Space]: SẴN SÀNG`);
      }

      // 8. Thanh Giỏ lưới LIFO phía dưới
      const cap = snap.hold_capacity || 12;
      const hold = snap.hold || [];
      panel(10, h - 64, w - 20, 56, { r: 10 });
      text(`🧺 GIỎ LƯỚI LIFO (${hold.length}/${cap}):`, 22, h - 43, { size: 12, bold: true, color: hold.length >= cap ? "#fb923c" : "#f6c453" });
      const counts = countItems(hold);
      const summary = Object.keys(counts).length
        ? Object.entries(counts).map(([k, n]) => `${kName(k)} ×${n}`).join(" · ")
        : "Chưa có nguyên liệu (Hái rau bằng [E] trên mặt nước, lặn bắt cá bằng [Space])";
      text(summary, 185, h - 43, { size: 12, color: "#e2e8f0", bold: Object.keys(counts).length > 0 });

      const slotW = Math.min(36, Math.floor((w - 420) / cap) - 4);
      for (let i = 0; i < cap; i++) {
        const sx0 = 22 + i * (slotW + 4), sy0 = h - 35;
        const item = hold[i];
        const isNewest = i === hold.length - 1 && hold.length > 0;
        roundRect(sx0, sy0, slotW, 20, 4);
        ctx.fillStyle = item ? kc(item) : "rgba(255, 255, 255, 0.08)";
        ctx.fill();
        ctx.strokeStyle = isNewest ? "#ffffff" : "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = isNewest ? 1.8 : 1;
        ctx.stroke();
        if (item) {
          const short = item === "ca_loc" ? "Lóc" : item === "ca_linh" ? "Linh" : item === "bong_dien_dien" ? "Đ.Điển" : "B.Súng";
          text(short, sx0 + slotW / 2, sy0 + 14, { size: 9, align: "center", bold: true, color: "#0f172a" });
        }
      }
      text("WASD/Mũi tên: Bơi · [E]: Cập bến / Hái rau · [Space]: Bắt cá · [H]: Thực đơn · [R]: Chơi lại", w - 22, h - 18, {
        size: 11, align: "right", color: "#94a3b8"
      });

      drawRecipeCard(w, h);
    }

    // ============================================================================
    // CẢNH 2: BUỔI TỐI — MỞ QUÁN (QUAN: nhìn từ trên xuống, x sang phải, z lên/bắc)
    // ============================================================================
    function drawQuan(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 16], z: [0, 10] };
      const X = b.x[1], Z = b.z[1], top = 74, bottom = 52;
      const s = Math.max(1, Math.min((w - 330) / X, (h - top - bottom - 20) / Z));
      const ox = Math.max(20, (w - 300 - s * X) / 2), oy = top + 10;
      const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
      const tNow = performance.now() * 0.001;

      // 1. Mặt sông ban đêm quanh nhà bè
      const riverNight = ctx.createRadialGradient(ox + (X * s) / 2, oy + (Z * s) / 2, s, ox + (X * s) / 2, oy + (Z * s) / 2, X * s);
      riverNight.addColorStop(0, "#172554");
      riverNight.addColorStop(1, "#060d1a");
      ctx.fillStyle = riverNight;
      ctx.fillRect(0, 0, w, h);

      // 2. Sàn gỗ Nhà Bè Má Tư
      roundRect(sx(0) - 6, sy(Z) - 6, X * s + 12, Z * s + 12, 10);
      ctx.fillStyle = "#5c3a21";
      ctx.fill();

      const floorGrad = ctx.createLinearGradient(sx(0), sy(Z), sx(X), sy(0));
      floorGrad.addColorStop(0, "#d4a373");
      floorGrad.addColorStop(1, "#b07d4f");
      ctx.fillStyle = floorGrad;
      ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

      // Vân ván gỗ sàn bè
      ctx.strokeStyle = "rgba(92, 58, 33, 0.22)";
      ctx.lineWidth = 1;
      for (let z = 1; z < Z; z++) {
        ctx.beginPath(); ctx.moveTo(sx(0), sy(z)); ctx.lineTo(sx(X), sy(z)); ctx.stroke();
      }
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 3;
      ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

      // Dây đèn lồng vàng buổi tối dọc mép bắc nhà bè
      for (let x = 1.5; x < X; x += 2.5) {
        const lx = sx(x), ly = sy(Z) + 4;
        const glow = 0.45 + 0.15 * Math.sin(tNow * 3 + x);
        ctx.fillStyle = `rgba(250, 204, 21, ${glow * 0.35})`;
        ctx.beginPath(); ctx.arc(lx, ly, 0.55 * s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.beginPath(); ctx.arc(lx, ly, 0.18 * s, 0, Math.PI * 2); ctx.fill();
      }

      const p = snap.player;
      const intR = meta.interact_radius || 1.5;
      const reservedOrders = (snap.customers || []).filter((c) => c.order_status === "reserved");

      // 3. Bếp nấu (Stoves — B1)
      (snap.stoves || []).forEach((st) => {
        const bx = sx(st.pos[0]), by = sy(st.pos[1]);
        const dist = p ? Math.hypot(p.pos[0] - st.pos[0], p.pos[1] - st.pos[1]) : 999;
        const inRange = dist <= intR;
        const dishObj = st.dish;
        const dishTitle = dName(dishObj);
        const dishKey = dId(dishObj);
        const orderId = dishObj && typeof dishObj === "object" ? dishObj.order_id : "";

        const col = st.state === "cooking" ? "#ea580c" : st.state === "ready" ? "#16a34a" : "#475569";
        // Khung bếp
        roundRect(bx - 0.95 * s, by - 0.85 * s, 1.9 * s, 1.7 * s, 8);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.lineWidth = inRange ? 2.5 : 1.5;
        ctx.strokeStyle = inRange ? "#fde047" : "#1e293b";
        ctx.stroke();

        // Mặt bếp tròn
        ctx.fillStyle = st.state === "cooking" ? "#fde047" : st.state === "ready" ? "#bbf7d0" : "#1e293b";
        ctx.beginPath(); ctx.arc(bx, by, 0.45 * s, 0, Math.PI * 2); ctx.fill();
        text(`BẾP ${st.id}`, bx, by + 4, { size: 11, align: "center", bold: true, color: st.state === "idle" ? "#e2e8f0" : "#0f172a" });

        // Nhãn trạng thái & thanh tiến độ nấu
        if (st.state === "cooking") {
          const cookMax = ((DEFAULT_MENU[dishKey] && DEFAULT_MENU[dishKey].cook_s) || 6) * 60;
          const left = st.cook_ticks_left || 0;
          bar(bx - 1.1 * s, by + 0.95 * s, 2.2 * s, 12, 1 - left / cookMax, "#f97316", `Đang nấu ${(left / 60).toFixed(1)}s`, { fontSize: 10 });
          text(`🔥 ${dishTitle} (${orderId})`, bx, by - 1.05 * s, { size: 11, align: "center", bold: true, color: "#7c2d12" });
        } else if (st.state === "ready") {
          text(`✨ ĐÃ CHÍN: ${dishTitle} (${orderId})`, bx, by - 1.05 * s, { size: 11, align: "center", bold: true, color: "#14532d" });
          text(inRange && !snap.hand ? "👉 Nhấn [E] Bưng món!" : "Chờ bưng [E]", bx, by + 1.15 * s, {
            size: 11, align: "center", bold: true, color: "#15803d"
          });
        } else {
          const canStart = reservedOrders.length > 0;
          text(canStart ? (inRange ? "👉 Nhấn [E] Nấu đơn chờ!" : "Sẵn sàng nấu [E]") : "Bếp rảnh (Chờ khách gọi)", bx, by + 1.1 * s, {
            size: 10, align: "center", bold: canStart, color: canStart ? "#9a3412" : "#475569"
          });
        }
      });

      // 4. Bàn & Khách (Tables & Customers — T1)
      const patMax = (meta.patience_s || 60) * 60;
      const eatMax = (meta.eat_s || 10) * 60;
      const tipMinRatio = meta.tip_min_patience_ratio || 0.5;
      const byTable = {};
      (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });

      (snap.tables || []).forEach((tb) => {
        const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
        const dist = p ? Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]) : 999;
        const inRange = dist <= intR;
        const c = byTable[tb.id];
        const handMatch = c && snap.hand && snap.hand.order_id === c.id && c.state === "waiting";

        // Mặt bàn tròn gỗ
        ctx.fillStyle = "#7c4a21";
        ctx.beginPath(); ctx.arc(tx, ty, 0.95 * s, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = (inRange && handMatch) ? 3 : 2;
        ctx.strokeStyle = (inRange && handMatch) ? "#4ade80" : "#451a03";
        ctx.stroke();
        text(`BÀN ${tb.id}`, tx, ty + 4, { size: 11, align: "center", bold: true, color: "#fef3c7" });

        if (!c) {
          text("Bàn trống (Chờ khách)", tx, ty + 1.25 * s, { size: 10, align: "center", color: "#57534e" });
        } else {
          const cx = tx, cy = ty - 1.55 * s;
          // Vẽ khách ngồi
          ctx.fillStyle = c.state === "eating" ? "#22c55e" : "#f43f5e";
          ctx.beginPath(); ctx.arc(cx, cy, 0.58 * s, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          text(c.id, cx, cy + 4, { size: 11, align: "center", bold: true, color: "#ffffff" });

          // Thẻ thông tin đơn của khách phía trên bàn
          const cardW = 190, cardH = 56;
          panel(cx - cardW / 2, cy - 0.65 * s - cardH, cardW, cardH, {
            bg: "rgba(15, 23, 42, 0.92)",
            border: handMatch ? "#4ade80" : "rgba(246, 196, 83, 0.45)",
            r: 8
          });
          text(`${c.id} · ${dName(c.dish_id)}`, cx, cy - 0.65 * s - cardH + 16, {
            size: 11, align: "center", bold: true, color: "#fde047"
          });

          if (c.state === "waiting") {
            const patLeft = c.patience_ticks_left ?? patMax;
            const patRatio = patLeft / patMax;
            const hasTip = patRatio >= tipMinRatio;
            const patCol = hasTip ? "#22c55e" : (patRatio > 0.25 ? "#f59e0b" : "#ef4444");
            bar(cx - cardW / 2 + 10, cy - 0.65 * s - cardH + 22, cardW - 20, 13, patRatio, patCol,
              `Kiên nhẫn: ${Math.ceil(patLeft / 60)}s ${hasTip ? "(+Boa 20%)" : "(Mất Boa!)"}`,
              { marker: tipMinRatio, fontSize: 10 });

            let stLabel = "⏳ Chờ bếp nấu [E tại B1]";
            let stCol = "#fbbf24";
            if (handMatch) {
              stLabel = inRange ? "👉 Nhấn [E] Phục vụ ngay!" : "🍲 Mang món trên tay tới bàn!";
              stCol = "#4ade80";
            } else if (c.order_status === "assigned") {
              stLabel = "🔥 Đang nấu/chờ bưng ở bếp";
              stCol = "#38bdf8";
            }
            text(stLabel, cx, cy - 0.65 * s - cardH + 49, { size: 10, align: "center", bold: true, color: stCol });
          } else if (c.state === "eating") {
            const eatLeft = c.eat_ticks_left ?? 0;
            const totalPay = (c.base_price || 0) + (c.tip || 0);
            bar(cx - cardW / 2 + 10, cy - 0.65 * s - cardH + 22, cardW - 20, 13, 1 - eatLeft / eatMax, "#38bdf8",
              `Đang ăn: ${Math.ceil(eatLeft / 60)}s`, { fontSize: 10 });
            text(`Sắp thu: +${totalPay}k (Giá ${c.base_price}k + Boa ${c.tip}k)`, cx, cy - 0.65 * s - cardH + 49, {
              size: 10, align: "center", bold: true, color: "#4ade80"
            });
          }
        }
      });

      // 5. Người chơi Út Sen trong quán
      if (p) {
        const px = sx(p.pos[0]), py = sy(p.pos[1]);
        if (intR) {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(px, py, intR * s, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.fillStyle = "#f97316";
        ctx.beginPath(); ctx.arc(px, py, 0.52 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        text("Út Sen", px, py + 0.85 * s, { size: 10, align: "center", bold: true, color: "#271206" });

        if (snap.hand) {
          const hName = dName(snap.hand);
          const hOrder = typeof snap.hand === "object" && snap.hand.order_id ? ` (${snap.hand.order_id})` : "";
          panel(px - 78, py - 0.65 * s - 26, 156, 22, { bg: "rgba(22, 163, 74, 0.94)", border: "#bbf7d0", r: 6 });
          text(`🍲 ${hName}${hOrder}`, px, py - 0.65 * s - 11, { size: 10, align: "center", bold: true, color: "#ffffff" });
        }
      }

      // 6. Thanh HUD phía trên (Buổi tối)
      panel(10, 8, w - 20, 54, { r: 10 });
      const timeLow = (snap.time_left_ticks || 0) < 30 * 60;
      text("🏮 BUỔI TỐI: QUÁN NHÀ BÈ MÁ TƯ", 22, 26, { size: 12, bold: true, color: "#f6c453" });
      text(`⏱ ${fmtTime(snap.time_left_ticks)}`, 22, 49, { size: 16, bold: true, color: timeLow ? "#ef4444" : "#f8fafc" });

      // Tiền, Uy tín, Điểm
      text(`💰 Tiền: ${snap.money ?? 0}k`, 225, 27, { size: 14, bold: true, color: "#facc15" });
      text(`Tổng thu: ${snap.earned ?? 0}k`, 225, 47, { size: 11, color: "#cbd5e1" });

      const rep = snap.reputation ?? 3.0;
      const fullStars = Math.floor(rep);
      let starStr = "";
      for (let i = 0; i < 5; i++) starStr += i < fullStars ? "★" : "☆";
      text(`Uy tín: ${rep.toFixed(1)} / 5.0 ${starStr}`, 355, 27, { size: 14, bold: true, color: "#38bdf8" });
      text(`🏆 ĐIỂM (SCORE): ${snap.score ?? 0}`, 355, 47, { size: 13, bold: true, color: "#4ade80" });

      // Ô hiển thị Món đang cầm trên tay
      panel(575, 13, 250, 44, {
        bg: snap.hand ? "rgba(20, 83, 45, 0.75)" : "rgba(30, 41, 59, 0.65)",
        border: snap.hand ? "#4ade80" : "rgba(148, 163, 184, 0.25)",
        r: 8
      });
      text("MÓN ĐANG BƯNG TRÊN TAY:", 587, 28, { size: 10, bold: true, color: "#94a3b8" });
      if (snap.hand) {
        const hOrder = snap.hand.order_id ? ` · Đơn ${snap.hand.order_id}` : "";
        const hPrice = snap.hand.base_price ? ` (${snap.hand.base_price}k)` : "";
        text(`🍲 ${dName(snap.hand)}${hOrder}${hPrice}`, 587, 46, { size: 12, bold: true, color: "#4ade80" });
      } else {
        text("(Tay trống)", 587, 46, { size: 12, color: "#cbd5e1" });
      }

      // 7. Thanh Kho nguyên liệu khả dụng phía dưới (Stock vs Reserved)
      const { stock, reserved, avail } = computeAvailableStock();
      panel(10, h - 44, w - 20, 36, { r: 8 });
      text("📦 KHO KHẢ DỤNG (Tồn - Giữ chỗ):", 20, h - 22, { size: 12, bold: true, color: "#f6c453" });
      const kinds = ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"];
      let kx = 248;
      kinds.forEach((k) => {
        const tot = stock[k] || 0, res = reserved[k] || 0, av = avail[k] || 0;
        const label = res > 0 ? `${kName(k)}: ${av} (Tồn ${tot}, Giữ ${res})` : `${kName(k)}: ${av}`;
        ctx.fillStyle = kc(k);
        ctx.beginPath(); ctx.arc(kx, h - 26, 5, 0, Math.PI * 2); ctx.fill();
        text(label, kx + 10, h - 22, { size: 12, bold: av > 0, color: av > 0 ? "#f1f5f9" : "#64748b" });
        kx += res > 0 ? 185 : 132;
      });

      text("WASD/Mũi tên: Đi · [E]: Tương tác Bếp / Bàn · [H]: Thực đơn · [R]: Chơi lại", w - 20, h - 22, {
        size: 11, align: "right", color: "#94a3b8"
      });

      drawRecipeCard(w, h);
    }

    // ---------- Vòng lặp Render ----------
    function frame() {
      requestAnimationFrame(frame);
      const [w, h] = fit();
      ctx.fillStyle = "#0b131e";
      ctx.fillRect(0, 0, w, h);
      if (snap) {
        if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
        eventLog(w, h);
        overlay(w, h);
      } else {
        text(offline ? "Không kết nối được máy chủ…" : "Đang tải Quán Ăn Chợ Nổi…", w / 2, h / 2, { align: "center", size: 18 });
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
